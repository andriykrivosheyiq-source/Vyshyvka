<!--
  КАТАЛОГ КЛІЄНТА (06.10) — loomiq.net/k/#d=…

  Андрій: «дизайн сторінки повинен бути саме такий» (знімки магазину:
  пошук угорі, каруселі банерів з крапками й підписом, блок бренду — велике
  фото + чотири плитки, стрічка карток у дві колонки на всю ширину з ♡ і ✕,
  закреслена ціна й червона, нижнє меню); «купа різних товарів з лого,
  банери, каруселі»; «заходиш у картку — і там можна змінити будь-який
  колір»; закреслена — ціна за 1 шт, червона — на тираж клієнта;
  перемикачів поки немає.

  Дані — у самому посиланні (компанія, логотип у хмарі, тираж). Каталог,
  розміщення, мокапи й ціна — loomiq-kit.js (той самий двигун, що в квізі),
  ціна — рушій КП. Банери-монтажі — з адмінки (Конструктор → Банери з
  логотипом). Оформлення з кошика — webOrders (site: 'kit') + Telegram.
-->
<style>
  :root{
    --ink:#111214; --muted:#8A8D93; --line:#ECEDF0; --paper:#FFFFFF; --soft:#F2F2F2;
    --sale:#E8501F; --blue:#0369A1; --cta:#111214;
    --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));}
  button,input{font-family:inherit;font-size:inherit;color:inherit;}
  .k-wrap{max-width:1180px;margin:0 auto;}
  .k-pad{padding:0 16px;}
  /* Пошук угорі */
  .k-top{position:sticky;top:0;z-index:20;background:#fff;padding:10px 16px 10px;}
  .k-top .k-wrap{display:flex;align-items:center;gap:10px;}
  .k-search{flex:1;display:flex;align-items:center;gap:10px;background:#F2F2F3;border-radius:14px;padding:0 14px;height:46px;}
  .k-search svg{flex:none;color:#8A8D93;}
  .k-search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0;}
  .k-me{width:46px;height:46px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;}
  .k-me img{max-width:72%;max-height:72%;}
  /* Каруселі */
  .k-car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0;}
  .k-car::-webkit-scrollbar{display:none;}
  .k-slide{flex:0 0 100%;scroll-snap-align:start;cursor:pointer;}
  .k-slide .im{position:relative;background:var(--soft);aspect-ratio:var(--ar,1.6);overflow:hidden;}
  .k-slide .im img{width:100%;height:100%;object-fit:cover;display:block;}
  .k-slide .duo{display:grid;grid-template-columns:1fr 1fr;height:100%;}
  .k-slide .duo img{width:100%;height:100%;object-fit:cover;}
  .k-dots{position:absolute;left:16px;bottom:14px;display:flex;gap:7px;z-index:2;}
  .k-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);}
  .k-dots i.on{background:#fff;}
  .k-capt{padding:12px 16px 26px;}
  .k-capt b{display:block;font-size:21px;font-weight:500;}
  .k-capt span{display:block;font-size:18px;color:var(--muted);margin-top:2px;}
  /* Бренд клієнта: чіпи + мозаїка */
  .k-h{font-size:28px;font-weight:500;letter-spacing:-.01em;margin:14px 16px 14px;}
  .k-chips{display:flex;gap:10px;overflow-x:auto;padding:0 16px 16px;scrollbar-width:none;}
  .k-chips::-webkit-scrollbar{display:none;}
  .k-chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:12px 18px;font-size:16px;cursor:pointer;}
  .k-chips button:first-child{background:var(--soft);border-color:var(--soft);}
  .k-mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:0 16px;margin-bottom:34px;cursor:pointer;}
  .k-mosaic > div{position:relative;background:var(--soft);overflow:hidden;aspect-ratio:7/10;}
  .k-mosaic > div:first-child{grid-row:1 / span 2;aspect-ratio:auto;}
  .k-mosaic img{width:100%;height:100%;object-fit:cover;display:block;}
  .k-mosaic .brand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;}
  .k-mosaic .brand img{width:auto;height:auto;max-width:72%;max-height:28%;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(0,0,0,.25));}
  /* Стрічка товарів */
  .k-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 4px;}
  .k-card{position:relative;text-align:left;cursor:pointer;padding-bottom:22px;min-width:0;}
  .k-card .pic{position:relative;background:var(--soft);aspect-ratio:7/10;overflow:hidden;}
  .k-card .pic > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .k-ic{position:absolute;top:10px;z-index:2;width:38px;height:38px;border:0;background:none;padding:0;cursor:pointer;color:#B9BBBF;display:flex;align-items:center;justify-content:center;}
  .k-ic.x{left:6px;} .k-ic.f{right:6px;}
  .k-ic.f.on{color:var(--sale);}
  .k-ic.f.on svg path{fill:var(--sale);}
  .k-tags{position:absolute;left:0;bottom:0;display:flex;z-index:2;}
  .k-tags span{background:#111;color:#fff;font-size:14px;padding:3px 9px;}
  .k-tags span.s{background:var(--sale);transform:skewX(-12deg);margin-left:-4px;padding:3px 11px;}
  .k-pr{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;padding:12px 14px 6px;font-size:21px;}
  .k-pr s{color:var(--ink);text-decoration-thickness:1.5px;}
  .k-pr .now{color:var(--sale);}
  .k-pr .one{color:var(--ink);}
  .k-nm{padding:0 14px;font-size:17px;line-height:1.35;}
  .k-nm small{display:block;font-size:17px;}
  .k-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .k-spin{width:24px;height:24px;border-radius:50%;border:3px solid #DCDDE0;border-top-color:#888;animation:ks .8s linear infinite;}
  @keyframes ks{to{transform:rotate(360deg);}}
  .k-full{grid-column:1 / -1;}
  .k-row{grid-column:1 / -1;margin:6px 0 30px;}
  .k-row h4{font-size:24px;font-weight:500;margin:0 16px 12px;}
  .k-row .k-car{gap:4px;padding:0 0 0 0;scroll-snap-type:x proximity;}
  .k-row .k-card{flex:0 0 42%;scroll-snap-align:start;}
  .k-hint{grid-column:1 / -1;}
  /* Нижнє меню */
  .k-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));}
  .k-nav .k-wrap{display:grid;grid-template-columns:repeat(5,1fr);}
  .k-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#8A8D93;cursor:pointer;position:relative;padding:4px 0;}
  .k-nav button.on{color:var(--ink);}
  .k-nav button .lg{font-weight:700;font-size:22px;line-height:24px;color:var(--ink);letter-spacing:-.04em;}
  .k-nav button i{position:absolute;top:-2px;left:calc(50% + 8px);background:#F04438;color:#fff;font-style:normal;font-size:12px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .k-nav button i[hidden]{display:none;}
  .k-toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:60;}
  /* Вікна */
  .k-ov{position:fixed;inset:0;z-index:50;background:rgba(17,18,20,.45);display:flex;align-items:flex-end;justify-content:center;}
  .k-sheet{background:#fff;width:100%;max-width:980px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));position:relative;}
  @media (min-width:860px){ .k-ov{align-items:center;} .k-sheet{border-radius:22px;} }
  .k-x{float:right;border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;}
  .k-fav{float:right;border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;cursor:pointer;margin-right:8px;color:#9A9CA1;display:flex;align-items:center;justify-content:center;}
  .k-fav.on{color:var(--sale);} .k-fav.on svg path{fill:var(--sale);}
  .k-pv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;clear:both;}
  .k-big{background:var(--soft);aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;}
  .k-big img{width:100%;height:100%;object-fit:contain;display:block;}
  .k-sheet h3{margin:4px 0 4px;font-size:22px;}
  .k-lbl{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  .k-sw{display:flex;flex-wrap:wrap;gap:8px;}
  .k-sw button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;}
  .k-sw button.on{box-shadow:0 0 0 2.5px var(--ink);}
  .k-vs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .k-v{border:1.5px solid var(--line);border-radius:12px;padding:5px;background:#fff;cursor:pointer;text-align:left;}
  .k-v.on{border-color:var(--ink);}
  .k-v .t{background:var(--soft);border-radius:8px;aspect-ratio:1;overflow:hidden;position:relative;}
  .k-v .t img{width:100%;height:100%;object-fit:contain;display:block;}
  .k-v b{display:block;font-size:12.5px;margin:6px 3px 0;}
  .k-v span{display:block;font-size:11.5px;color:var(--muted);margin:1px 3px 2px;}
  .k-qty{display:flex;align-items:center;gap:8px;}
  .k-qty button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:20px;cursor:pointer;}
  .k-qty input{width:90px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:9px;font-size:16px;}
  .k-sum{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 12px;}
  .k-sum b{font-size:26px;letter-spacing:-.02em;}
  .k-note{font-size:13px;color:var(--muted);line-height:1.45;}
  .k-btn{border:0;background:var(--cta);color:#fff;border-radius:14px;padding:15px 20px;font-weight:600;font-size:16px;cursor:pointer;}
  .k-btn:disabled{background:#C9CED8;cursor:not-allowed;}
  .k-line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .k-line .th{width:70px;height:70px;border-radius:10px;background:var(--soft);overflow:hidden;flex:none;}
  .k-line .th img{width:100%;height:100%;object-fit:contain;}
  .k-line .tx{flex:1;min-width:0;font-size:14px;}
  .k-line .tx small{display:block;color:var(--muted);}
  .k-line .s{text-align:right;font-weight:600;white-space:nowrap;}
  .k-line .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 0;}
  .k-in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;margin-bottom:8px;outline:none;}
  .k-in:focus{border-color:var(--ink);}
  .k-err{color:#B42318;font-size:14px;min-height:18px;}
  .k-ok{background:#ECFDF3;color:#05603A;border-radius:14px;padding:16px;font-size:15px;line-height:1.5;}
  .k-empty{max-width:520px;margin:80px auto;text-align:center;padding:0 16px;}
  .k-empty a{color:#fff;text-decoration:none;display:inline-block;margin-top:14px;}
  .k-favs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:12px;}
  @media (max-width:980px){ .k-grid{grid-template-columns:repeat(3,minmax(0,1fr));} .k-row .k-card{flex-basis:30%;} }
  @media (max-width:700px){
    .k-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .k-row .k-card{flex-basis:46%;}
    .k-pv{grid-template-columns:1fr;}
    .k-pr{font-size:19px;padding:10px 12px 4px;} .k-nm{padding:0 12px;font-size:15.5px;} .k-nm small{font-size:15.5px;}
    .k-h{font-size:26px;}
    .k-favs{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (min-width:701px){ .k-slide{flex-basis:100%;} }
</style>
</head>
<body>
<header class="k-top"><div class="k-wrap">
  <label class="k-search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
    <input id="kQ" type="search" placeholder="Товар чи тип одягу" autocomplete="off"></label>
  <div class="k-me" id="kLogo" title="Ваш логотип"></div>
</div></header>
<main id="kMain"></main>
<nav class="k-nav" id="kNav" hidden><div class="k-wrap">
  <button class="on" data-nav="home"><span class="lg">lq</span>Головна</button>
  <button data-nav="cat"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h11M3 11h7M3 16h6"/><circle cx="16" cy="14" r="4.5"/><path d="M19.5 17.5L22 20"/></svg>Каталог</button>
  <button data-nav="cart"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 7h14l-1 14H6L5 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>Кошик<i id="kCartN" hidden></i></button>
  <button data-nav="fav"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20s-7-4.4-9-8.6C1.5 8 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.5 3.5 4 6.9C19 15.6 12 20 12 20z"/></svg>Обране<i id="kFavN" hidden></i></button>
  <button data-nav="mgr"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v11H8l-4 4V5z"/><path d="M8 9h8M8 12h5"/></svg>Менеджер</button>
</div></nav>

<script>
(function(){
  'use strict';
  var W = window, D = document, K = W.LQKit, C = W.SITE_CONTENT;
  var esc = K.esc, грн = K.грн;
  var KIT = K.kitRead(location.hash);
  var LOGO = null;                     // завантажене зображення логотипа
  var MK = {};                         // 'gid|cid|key' → Promise(мокап)
  var SEL = {};                        // gid → { cid, key, qty } — що обрано у вікні товару
  var CART = [];                       // [{ gid, cid, key, qty }]
  var FAV = [], HIDE = [];             // 'gid|key' — обране й приховане
  var CKEY = '', Q = '';
  var HEART = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20s-7-4.4-9-8.6C1.5 8 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.5 3.5 4 6.9C19 15.6 12 20 12 20z"/></svg>';
  var CROSS = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l14 14M19 5L5 19"/></svg>';
  function track(n, p){ try{ W.lqAn && W.lqAn.track(n, p || {}); }catch(e){} }
  function toast(t){ var el = D.createElement('div'); el.className = 'k-toast'; el.textContent = t; D.body.appendChild(el); setTimeout(function(){ el.remove(); }, 1800); }
  function plural(n, one, few, many){
    var m10 = n % 10, m100 = n % 100;
    return n + ' ' + (m10 === 1 && m100 !== 11 ? one : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? few : many);
  }
  function people(){ return Math.max(1, KIT.people || 10); }
  function ls(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
  function isFav(k){ return FAV.indexOf(k) >= 0; }
  function toggleFav(k){ var i = FAV.indexOf(k); if(i >= 0) FAV.splice(i, 1); else FAV.push(k); ls(CKEY + ':fav', FAV); badges(); return i < 0; }
  /* Ходові кольори — з них картки стрічки беруть «свій» колір, щоб стрічка
     була різною; будь-який інший — у вікні товару. */
  var POP = ['black', 'white', 'lgray', 'gray', 'navy', 'green', 'sand', 'bordo'];
  function colorsPop(g){
    var out = [];
    POP.forEach(function(id){ var c = g.colors.filter(function(x){ return x.id === id; })[0]; if(c) out.push(c); });
    g.colors.forEach(function(c){ if(out.indexOf(c) < 0) out.push(c); });
    return out;
  }
  function colorOf(gid){
    var g = K.gOf(gid); if(!g) return null;
    var want = (SEL[gid] && SEL[gid].cid) || KIT.colors[gid];
    return g.colors.filter(function(x){ return x.id === want; })[0] || colorsPop(g)[0];
  }
  function keyOf(gid){
    var pl = K.placesFor(gid), s = SEL[gid] && SEL[gid].key;
    return pl.indexOf(s) >= 0 ? s : (pl.indexOf('center') >= 0 ? 'center' : pl[0]);
  }
  function mock(gid, cid, key){
    var k = gid + '|' + cid + '|' + key;
    if(!MK[k]) MK[k] = K.renderMock(gid, cid, key, LOGO, KIT.logo).catch(function(){ return null; });
    return MK[k];
  }
  function src(mk){ return mk ? (mk.url || mk.photo) : ''; }

  /* ── Ціна: рушій КП. Закреслена — за 1 шт, червона — на тираж клієнта. ── */
  function unitSolo(gid, mk, qty){
    if(!K.hasPrice(gid) || !mk) return 0;
    var r = W.LQ.priceOrder([K.desc(gid, mk, qty)]);
    return (r[0] || {}).unit || 0;
  }
  function cartPrices(extra){
    var lines = CART.slice(); if(extra) lines.push(extra);
    var ok = lines.length && lines.every(function(l){ return K.hasPrice(l.gid); });
    return Promise.all(lines.map(function(l){ return mock(l.gid, l.cid, l.key); })).then(function(mks){
      var list = lines.map(function(l, i){ return K.desc(l.gid, mks[i], l.qty); });
      return { lines: lines, mks: mks, r: ok ? W.LQ.priceOrder(list) : null };   // r null — ціну скаже менеджер
    });
  }

  /* ══════════ СТРІЧКА ══════════
     Товари — «виріб × варіант розміщення», кожен у своєму ходовому кольорі:
     так стрічка виходить довгою й різною, а будь-який колір — у вікні. */
  var CATS = [
    { id:'tee', name:'Футболки', m:/^tee/ }, { id:'hoodie', name:'Худі', m:/^hoodie/ },
    { id:'sweat', name:'Світшоти', m:/^sweat/ }, { id:'cap', name:'Кепки', m:/^cap/ }, { id:'tote', name:'Шопери', m:/^tote/ } ];
  function items(){
    var out = [];
    K.garments().forEach(function(g){
      var cols = colorsPop(g), keys = K.placesFor(g.id);
      keys.forEach(function(k, i){
        var c = (i === 0 && KIT.colors[g.id] && g.colors.filter(function(x){ return x.id === KIT.colors[g.id]; })[0]) || cols[i % Math.min(4, cols.length)];
        out.push({ g: g, key: k, c: c, id: g.id + '|' + k });
      });
    });
    /* Перемішуємо по виробах: футболка, худі, кепка… — а не три футболки поспіль. */
    var by = {}, order = [];

      var others = CART.filter(function(l, n){ return n !== edit && !(l.gid === gid && l.cid === s.cid && l.key === s.key); });
      var save0 = CART; CART = others;
      cartPrices({ gid: gid, cid: s.cid, key: s.key, qty: s.qty }).then(function(p){
        var u = ov.querySelector('#kUnit'), t = ov.querySelector('#kTot');
        if(!u || !t) return;
        if(!p.r){ u.textContent = 'Ціну порахує менеджер'; t.textContent = ''; return; }
        var r = p.r[p.r.length - 1] || {};
        u.textContent = s.qty + ' шт × ' + грн(r.unit);
        t.textContent = грн(r.sum);
      });
      CART = save0;
    }
    draw();
  }

  /* ══════════ КОШИК ══════════ */
  function saveCart(){ try{ localStorage.setItem(CKEY, JSON.stringify(CART)); }catch(e){} }
  function loadCart(){ try{ var c = JSON.parse(localStorage.getItem(CKEY) || '[]'); if(Array.isArray(c)) CART = c.filter(function(l){ return l && K.gOf(l.gid); }); }catch(e){} }
  function openCart(done){
    var ov = D.createElement('div'); ov.className = 'k-ov';
    ov.innerHTML = '<div class="k-sheet" role="dialog" aria-label="Кошик" style="max-width:640px"></div>';
    D.body.appendChild(ov);
    ov.onclick = function(e){ if(e.target === ov) ov.remove(); };
    var sh = ov.querySelector('.k-sheet');
    var Q = {}; try{ Q = JSON.parse(localStorage.getItem('lq_quiz_v1') || '{}') || {}; }catch(e){}
    var F = { name: Q.name || '', phone: Q.phone || '', tg: Q.tg || '' };
    function draw(msg){
      if(done || msg === 'ok'){
        sh.innerHTML = '<button class="k-x" data-x>✕</button><h3>Дякуємо!</h3><div class="k-ok">Замовлення отримали. Менеджер звʼяжеться з вами, ' +
          'щоб уточнити розміри й підготувати макет. Цей каталог лишається за посиланням — можна повернутись будь-коли.</div>';
        sh.querySelector('[data-x]').onclick = function(){ ov.remove(); };
        return;
      }
      if(!CART.length){
        sh.innerHTML = '<button class="k-x" data-x>✕</button><h3>Кошик порожній</h3><p class="k-note">Натисніть на виріб, оберіть колір і розміщення — і додайте в кошик.</p>';
        sh.querySelector('[data-x]').onclick = function(){ ov.remove(); };
        return;
      }
      sh.innerHTML = '<button class="k-x" data-x>✕</button><h3>Кошик</h3><div id="kLines"></div>' +
        '<div class="k-sum"><span class="k-note">Разом</span><b id="kCartTot"></b></div>' +
        '<div class="k-lbl">Контакти</div>' +
        '<input class="k-in" id="kfName" placeholder="Ваше імʼя" maxlength="60" value="' + esc(F.name) + '">' +
        '<input class="k-in" id="kfPhone" type="tel" inputmode="tel" placeholder="+380 __ ___ __ __" value="' + esc(F.phone) + '">' +
        '<input class="k-in" id="kfTg" placeholder="Telegram чи Instagram (необовʼязково)" maxlength="60" value="' + esc(F.tg) + '">' +
        '<div class="k-err" id="kErr">' + esc(msg || '') + '</div>' +
        '<button class="k-btn" style="width:100%" data-go>Оформити замовлення</button>' +
        '<p class="k-note">Ціна орієнтовна — остаточну менеджер підтвердить після перевірки логотипа й розмірів.</p>';
      sh.querySelector('[data-x]').onclick = function(){ ov.remove(); };
      ['Name', 'Phone', 'Tg'].forEach(function(k){ var el = sh.querySelector('#kf' + k); el.oninput = function(){ F[k.toLowerCase()] = el.value; }; });
      cartPrices().then(function(p){
        var box = sh.querySelector('#kLines'); if(!box) return;
        box.innerHTML = CART.map(function(l, i){
          var g = K.gOf(l.gid) || { name: l.gid, colors: [] }, c = g.colors.filter(function(x){ return x.id === l.cid; })[0] || { name:'' };
          var r = p.r ? p.r[i] : null, mk = p.mks[i];
          return '<div class="k-line"><div class="th">' + (mk ? '<img alt="" src="' + esc(src(mk)) + '">' : '') + '</div>' +
            '<div class="tx"><b>' + esc(g.name) + '</b><small>' + esc(c.name) + ' · ' + esc(K.vinfo(l.gid, l.key).name.toLowerCase()) + '</small>' +
            '<small>' + l.qty + ' шт' + (r ? ' × ' + грн(r.unit) : '') + '</small>' +
            '<button class="rm" data-ed="' + i + '">змінити</button> · <button class="rm" data-rm="' + i + '">прибрати</button></div>' +
            '<div class="s">' + (r ? грн(r.sum) : '') + '</div></div>';
        }).join('');
        var tot = p.r ? p.r.reduce(function(a, x){ return a + (x.sum || 0); }, 0) : 0;
        sh.querySelector('#kCartTot').textContent = tot ? грн(tot) : 'порахує менеджер';
        box.querySelectorAll('[data-rm]').forEach(function(b){ b.onclick = function(){ CART.splice(+b.dataset.rm, 1); saveCart(); bar(); draw(); }; });
        box.querySelectorAll('[data-ed]').forEach(function(b){ b.onclick = function(){ var n = +b.dataset.ed, l = CART[n]; ov.remove();
          openSheet(l.gid, null, n); }; });
      });
      sh.querySelector('[data-go]').onclick = function(){ checkout(F, draw, sh.querySelector('[data-go]')); };
    }
    draw();
  }
  function checkout(F, draw, btn){
    var phone = K.phoneNorm(F.phone);
    if(String(F.name).trim().length < 2) return draw('Вкажіть, будь ласка, імʼя.');
    if(!phone) return draw('Перевірте номер телефону: потрібен український, +380…');
    btn.disabled = true; btn.textContent = 'Надсилаємо…';
    var name = String(F.name).trim().slice(0, 60);
    track('kit_checkout');
    try{ W.lqAn && W.lqAn.step('checkout'); }catch(e){}
    cartPrices().then(function(p){
      var lines = CART.slice(), rows = p.r || [], mks = p.mks;
      var text = lines.map(function(l, i){
        var g = K.gOf(l.gid) || { name: l.gid, colors: [] }, c = g.colors.filter(function(x){ return x.id === l.cid; })[0] || { name:'' };
        return '• ' + g.name + ', ' + c.name + ' — ' + l.qty + ' шт · ' + K.vinfo(l.gid, l.key).name.toLowerCase() +
          (mks[i] ? ' ' + K.sizeText(mks[i]) : '') + (rows[i] ? ' · ' + грн(rows[i].sum) : '');
      }).join('\n');
      var tot = rows.reduce(function(a, x){ return a + (x.sum || 0); }, 0);
      var head = '🛒 Каталог клієнта: замовлення' + (KIT.company ? ' · ' + KIT.company : '') + '\nІмʼя: ' + name + (F.tg ? ' · ' + String(F.tg).trim() : '') +
        '\n' + text + (tot ? '\nРазом: ' + грн(tot) : '');
      K.lead(phone, head);                                  // контакт — одразу, до завантажень
      return Promise.all(mks.map(function(mk){ return mk && mk.url ? K.upload(mk.url) : Promise.resolve(null); })).then(function(ups){
        var items = lines.map(function(l, i){
          var g = K.gOf(l.gid) || { name: l.gid, colors: [] }, c = g.colors.filter(function(x){ return x.id === l.cid; })[0] || { id: l.cid, name:'' };
          var mk = mks[i] || {}, r = rows[i] || {}, v = K.vinfo(l.gid, l.key), meth = K.methodFor(l.gid);
          return { kind:'kit', name: g.name, color: c.name, print: meth === 'embro' ? 'Вишивка' : 'DTF', sizes:'',
            qty: l.qty, unitPrice: Math.round(r.unit || 0), price: Math.round(r.sum || 0), unitCost: 0, cost: 0,
            mockups: [ups[i]].filter(Boolean),
            prints: (mk.parts || [{ side: v.sides[0], wCm: mk.wCm, hCm: mk.hCm }]).map(function(q){
              return { side: q.side, technique: meth === 'embro' ? 'Вишивка' : 'DTF', widthMm: Math.round((q.wCm || 0) * 10),
                       heightMm: Math.round((q.hCm || 0) * 10), place: v.name, file: KIT.logo.url }; }),
            config: { garmentId: l.gid, colorId: c.id, printId: meth, qty: l.qty, logos: {} } };
        });
        var order = { orderId: 'K' + Date.now().toString(36).toUpperCase(), name: name, phone: phone, site: 'kit', items: items,
          totalPrice: items.reduce(function(a, x){ return a + x.price; }, 0), totalCost: 0, page: '/k/',
          note: ('Каталог клієнта' + (KIT.company ? ' · ' + KIT.company : '') + (F.tg ? ' · ' + String(F.tg).trim() : '') +
                 ' · логотип: ' + KIT.logo.url + ' · каталог: ' + location.href).slice(0, 1800),
          createdAt: new Date().toISOString(), imported: false,
          an: (W.lqAn && W.lqAn.attribution && W.lqAn.attribution()) || null };
        var files = [{ url: KIT.logo.url, kind:'logo', caption:'Логотип клієнта' }];
        items.forEach(function(it){ if(it.mockups[0]) files.push({ url: it.mockups[0], kind:'mockup', caption: it.name + ', ' + it.color }); });
        return K.addOrder(order).then(function(){
          K.lead(phone, '🛒 Каталог клієнта: мокапи для ' + name + ' (картка в Канбані, «Нове»)', files);
        }, function(e){
          K.lead(phone, '⚠️ Каталог клієнта: замовлення НЕ потрапило в Канбан (' + ((e && (e.code || e.message)) || 'помилка') + '). Заведіть вручну.\n' + head, files);
        });
      });
    }).then(function(){ CART = []; saveCart(); bar(); draw('ok'); }, function(){ CART = []; saveCart(); bar(); draw('ok'); });
  }


  /* ══════════ СТАРТ ══════════ */
  function empty(){
    D.getElementById('kMain').innerHTML = '<div class="k-empty"><h2>Посилання неповне</h2><p class="k-note">Схоже, адресу скопіювали не до кінця. ' +
      'Пройдіть квіз — і отримаєте каталог з вашим логотипом за хвилину.</p><a class="k-btn" href="/quiz/">Пройти квіз</a></div>';
  }
  /* Нове посилання в тій самій вкладці — це лише зміна «#…», сторінка сама
     не перезавантажиться. А в посиланні — увесь каталог, тож читаємо заново. */
  W.addEventListener('hashchange', function(){ location.reload(); });
  if(!KIT){ empty(); return; }
  CKEY = 'lq_kit_cart_' + KIT.logo.url.slice(-40);
  D.title = (KIT.company ? KIT.company + ' — ' : '') + 'мерч з вашим логотипом · Loomiq';
  D.getElementById('kLogo').innerHTML = '<img alt="" src="' + esc(KIT.logo.url) + '">';
  var qi = D.getElementById('kQ'), qt = null;
  qi.oninput = function(){ clearTimeout(qt); qt = setTimeout(function(){ Q = qi.value.trim(); render(); }, 250); };
  K.boot(function(){
    K.loadImg(KIT.logo.url).then(function(im){
      if(!im){ empty(); return; }
      LOGO = im;
      FAV = ls(CKEY + ':fav') || []; HIDE = ls(CKEY + ':hide') || [];
      loadCart(); D.getElementById('kNav').hidden = false; render();
    });
  });
  W.__kit = { state: function(){ return { KIT: KIT, CART: CART, SEL: SEL, FAV: FAV }; }, mock: mock };
})();
</script>
