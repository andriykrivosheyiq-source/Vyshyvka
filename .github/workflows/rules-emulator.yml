name: Правила бази на емуляторі

# 27.10: правила бази (гроші, номери замовлень, закритий документ із
# зарплатами й правами) перевіряються на справжньому емуляторі Firestore.
# Доти ці тести локально тихо пропускались — тут пропуск = червоний.
# Червоний значок — правила не можна публікувати в консолі.
on:
  pull_request:
  push:
    paths: ['firestore.rules', 'tests/money-rules.mjs', 'tests/order-nos.mjs', 'tests/private-doc.mjs', '.github/workflows/rules-emulator.yml']

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Емулятор Firestore
        run: |
          mkdir -p /tmp/claude-0/emu && cd /tmp/claude-0/emu
          npm init -y >/dev/null
          npm i --no-audit --no-fund --legacy-peer-deps firebase-tools @firebase/rules-unit-testing firebase
          npx firebase setup:emulators:firestore
          ls ~/.cache/firebase/emulators
      - name: Правила — гроші, номери, закритий документ
        env:
          LQ_EMU_DIR: /tmp/claude-0/emu
        run: |
          bad=0
          for t in money-rules order-nos private-doc; do
            echo "▶ $t"
            code=0; node tests/$t.mjs > /tmp/$t.log 2>&1 || code=$?
            cat /tmp/$t.log
            if grep -q "пропущено: немає емулятора" /tmp/$t.log; then echo "::error title=$t::емулятор не підхопився"; bad=1; fi
            grep "✗" /tmp/$t.log | head -20 | while IFS= read -r l; do echo "::error title=$t::$l"; done
            if [ "$code" != "0" ]; then echo "::error title=$t::код виходу $code: $(tail -3 /tmp/$t.log | tr '\n' ' ' | cut -c1-300)"; bad=1; fi
          done
          exit $bad
