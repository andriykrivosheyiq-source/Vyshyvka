<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Договорились! 🛸</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💌</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="card">
  <span class="notch"></span>

  <div class="ticket">
    <!-- Поклади в цю папку us.jpg — і замість тарілки буде ваше фото. -->
    <img class="pair" src="us.jpg" alt=""
         onerror="this.outerHTML='&lt;div class=&quot;art&quot;&gt;🛸&lt;/div&gt;'">
    <h1>Договорились!</h1>
    <p class="lead" id="summary"></p>

    <div class="perf"></div>

    <div class="row"><i class="ico">📅</i><span id="row-date"></span></div>
    <div class="row"><i class="ico">🕕</i><span id="row-time"></span></div>
    <div class="row"><i class="ico">✨</i><span id="row-plan"></span></div>

    <p class="hint">Скриншоть и сохрани 📸</p>
  </div>

  <a class="sign" href="kiss.html">Жду встречи, Вовочка 💋</a>
</main>

<script src="app.js"></script>
<script src="track.js"></script>
<script>
  var data = DateInvite.read();
  var plan = DateInvite.plan(data.plan);

  // Прямий захід без деталей — назад на початок.
  if (!data.date || !data.time || !plan) location.replace('index.html');

  var day = DateInvite.humanDate(data.date);
  var isToday = data.date === DateInvite.today();

  document.getElementById('summary').textContent = 'Встречаемся ' +
    (isToday ? 'сегодня' : day) + ' в ' + data.time + '. В планах: ' + plan.name + '.';
  document.getElementById('row-date').textContent = isToday ? 'Сегодня, ' + day : day;
  document.getElementById('row-time').textContent = data.time;
  document.getElementById('row-plan').textContent = plan.name;

  Track.send('done', day + ' · ' + data.time + ' · ' + plan.name);
</script>

</body>
</html>
