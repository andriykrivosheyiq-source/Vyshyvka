<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Коли тобі буде зручно? 🛸</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💌</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="card">
  <span class="notch"></span>
  <div class="art">🛸</div>
  <h1>Коли тобі<br>буде зручно?</h1>

  <div class="field">
    <label class="label" for="day">Дата</label>
    <input type="date" id="day">
  </div>

  <div class="field">
    <span class="label">Час</span>
    <div class="time">
      <select id="hh" aria-label="Години">
        <option value="">ГГ</option>
      </select>
      <span class="colon">:</span>
      <select id="mm" aria-label="Хвилини">
        <option value="">ХВ</option>
      </select>
    </div>
  </div>

  <a class="btn" id="next" aria-disabled="true">Обери дату 🤍</a>
</main>

<script src="app.js"></script>
<script>
  var day = document.getElementById('day');
  var hh = document.getElementById('hh');
  var mm = document.getElementById('mm');
  var next = document.getElementById('next');

  function fill(select, count, step) {
    for (var value = 0; value < count; value += step) {
      var option = document.createElement('option');
      option.value = option.textContent = String(value).padStart(2, '0');
      select.appendChild(option);
    }
  }

  fill(hh, 24, 1);
  fill(mm, 60, 5);

  // Раніше за сьогодні побачення не призначиш.
  var today = new Date();
  day.min = today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0');

  // Якщо повернулися назад — підставляємо вже обране.
  var saved = DateInvite.read();
  if (saved.date) day.value = saved.date;
  if (saved.time) {
    hh.value = saved.time.split(':')[0];
    mm.value = saved.time.split(':')[1];
  }

  function refresh() {
    var ready = day.value && hh.value && mm.value;
    next.setAttribute('aria-disabled', ready ? 'false' : 'true');
    next.textContent = ready ? 'Далі 🤍' : 'Обери дату 🤍';

    if (ready) {
      // Внутрішнє посилання без домена — тільки ім'я файлу й параметри.
      next.href = 'what.html?d=' + encodeURIComponent(day.value) +
        '&t=' + encodeURIComponent(hh.value + ':' + mm.value);
    } else {
      next.removeAttribute('href');
    }
  }

  [day, hh, mm].forEach(function (field) {
    field.addEventListener('change', refresh);
    field.addEventListener('input', refresh);
  });

  refresh();
</script>

</body>
</html>
