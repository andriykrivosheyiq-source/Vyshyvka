<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тебе пришло приглашение 💌</title>
<meta name="description" content="Маленькое приглашение на свидание: согласись, выбери время и что делаем.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💌</text></svg>">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<main class="card">
  <span class="notch"></span>

  <!-- Поки файлу photo.jpg немає — показуємо ведмедика. Щойно покладеш
       фото в цю папку, воно з'явиться саме, правити нічого не треба. -->
  <img class="avatar" src="photo.jpg" alt="" onerror="this.outerHTML='&lt;div class=&quot;art&quot;&gt;🧸&lt;/div&gt;'">

  <p class="eyebrow">Приглашение</p>
  <h1>Лера, пойдёшь<br>со мной на свидание?</h1>

  <a class="btn" id="yes" href="yes.html">Да, конечно</a>
  <div class="ghost-slot">
    <button class="btn-ghost" id="no" type="button">Нет</button>
  </div>
</main>

<script src="app.js?v=4"></script>
<script src="track.js?v=4"></script>
<script>
  // Нова спроба — старі відповіді не потрібні.
  DateInvite.forget();
  Track.send('open', 'открыла приглашение');

  // Кнопка «Нет» тікає по всьому екрану й ніколи не дається натиснути.
  var no = document.getElementById('no');
  var yes = document.getElementById('yes');
  // Двадцять різних фраз, кожна показується рівно раз. Далі кнопка прощається
  // й вилітає — жодного повтору й жодного кола.
  var excuses = [
    'Нет',
    'Точно нет?',
    'А если подумать?',
    'Ну пожалуйста 🥺',
    'Не-а, мимо',
    'Серьёзно?',
    'Эта кнопка сломана',
    'Не поймаешь 😏',
    'Опять промазала 🙈',
    'Я быстрее, смирись',
    'Даже не пытайся',
    'Кнопка ушла на обед 🍕',
    'Я тут вообще для красоты',
    'Сюда нельзя, честно',
    'Ой, не туда 😅',
    'Может, всё-таки да?',
    'Я устала убегать 🥵',
    'Жми красную, она добрая 😌',
    'Всё, я ухожу',
    'Последняя попытка',
    'Сейчас кнопка исчезнет…'
  ];
  var tries = 0;
  var gone = false;
  var phraseAt = 0;

  // Один дотик = одна фраза. Без цього pointerenter, pointerdown і click
  // спалювали б по три репліки за один рух миші.
  function nextPhrase() {
    var now = Date.now();
    if (now - phraseAt < 450) return false;
    phraseAt = now;
    tries++;
    return true;
  }

  // Фрази скінчилися — кнопка прощається й вилітає геть.
  function flyAway() {
    gone = true;
    no.style.transition = 'left .8s ease-in, top .8s ease-in, transform .8s ease-in, opacity .8s ease-in';
    no.style.left = (window.innerWidth + 320) + 'px';
    no.style.top = (-260) + 'px';
    no.style.transform = 'rotate(540deg) scale(.35)';
    no.style.opacity = '0';
    setTimeout(function () { no.remove(); }, 900);
    Track.send('no', 'кнопка «Нет» улетела совсем');
  }

  function dodge(event) {
    if (event) event.preventDefault();
    if (gone) return;

    // Фраза змінюється не частіше ніж раз на 450 мс, а тікає кнопка завжди.
    if (nextPhrase()) {
      if (tries >= excuses.length) {
        flyAway();
        return;
      }
      no.textContent = excuses[tries];
      if (tries <= 10) Track.send('no', 'жала «Нет» — попытка ' + tries);
    }

    no.classList.add('is-loose');

    var pad = 12;
    var width = no.offsetWidth;
    var height = no.offsetHeight;
    var maxX = Math.max(pad, window.innerWidth - width - pad);
    var maxY = Math.max(pad, window.innerHeight - height - pad);
    var target = yes.getBoundingClientRect();
    var x = pad;
    var y = pad;

    // Шукаємо місце подалі від курсора і не поверх кнопки «Да».
    for (var attempt = 0; attempt < 24; attempt++) {
      x = pad + Math.random() * (maxX - pad);
      y = pad + Math.random() * (maxY - pad);

      var farFromPointer = !event || typeof event.clientX !== 'number' ||
        Math.hypot(x + width / 2 - event.clientX, y + height / 2 - event.clientY) > 150;
      var missesYes = x > target.right + 8 || x + width < target.left - 8 ||
        y > target.bottom + 8 || y + height < target.top - 8;

      if (farFromPointer && missesYes) break;
    }

    no.style.left = x + 'px';
    no.style.top = y + 'px';
  }

  no.addEventListener('pointerenter', dodge);
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('click', dodge);

  yes.addEventListener('click', function () {
    Track.send('yes', 'согласилась');
  });
</script>

</body>
</html>
