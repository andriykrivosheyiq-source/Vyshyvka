<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что будем делать? 💕</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💌</text></svg>">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<main class="card">
  <span class="notch"></span>
  <div class="art">💕</div>
  <h1>Что будем<br>делать?</h1>
  <p class="lead">Выбирай всё, что хочется — можно несколько</p>

  <div class="grid" id="grid"></div>

  <a class="btn" id="next" aria-disabled="true">Выбери хотя бы одно 🤍</a>
</main>

<script src="app.js?v=4"></script>
<script src="track.js?v=4"></script>
<script>
  var picked = DateInvite.read();

  // Без дати й часу повертаємось на початок.
  if (!picked.date || !picked.time) location.replace('index.html');

  var grid = document.getElementById('grid');
  var next = document.getElementById('next');
  var chosen = [];

  Object.keys(DateInvite.plans).forEach(function (code) {
    var plan = DateInvite.plans[code];
    var tile = document.createElement('button');

    tile.className = 'tile';
    tile.type = 'button';
    tile.setAttribute('aria-pressed', 'false');
    tile.innerHTML = '<span class="emoji">' + plan.emoji + '</span>' +
      '<span class="name">' + plan.name + '</span>';

    // Плитка перемикається: тиснеш ще раз — знімається вибір.
    tile.addEventListener('click', function () {
      var at = chosen.indexOf(code);
      var on = at === -1;

      if (on) chosen.push(code); else chosen.splice(at, 1);

      tile.classList.toggle('is-picked', on);
      tile.setAttribute('aria-pressed', String(on));
      refresh();
    });

    grid.appendChild(tile);
  });

  function refresh() {
    if (chosen.length) {
      next.setAttribute('aria-disabled', 'false');
      next.textContent = 'Дальше 🤍';
      // Внутрішнє посилання без домена: done.html?d=…&t=…&p=sushi,wine
      next.href = DateInvite.link('done.html', { p: chosen.join(',') });
    } else {
      next.setAttribute('aria-disabled', 'true');
      next.textContent = 'Выбери хотя бы одно 🤍';
      next.removeAttribute('href');
    }
  }

  next.addEventListener('click', function () {
    if (!chosen.length) return;
    var names = DateInvite.listNames(DateInvite.chosen(chosen.join(',')));
    // Через двокрапку, бо «выбрала пицца и вино» звучало б криво.
    Track.send('plan', 'выбрала: ' + names.toLowerCase());
  });

  refresh();
</script>

</body>
</html>
