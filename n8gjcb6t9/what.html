<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что будем делать? 💕</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💌</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="card">
  <span class="notch"></span>
  <div class="art">💕</div>
  <h1>Что будем<br>делать?</h1>
  <p class="lead">Выбери то, что хочется больше всего</p>

  <div class="grid" id="grid"></div>
</main>

<script src="app.js"></script>
<script src="track.js"></script>
<script>
  var picked = DateInvite.read();

  // Без дати й часу повертаємось на початок.
  if (!picked.date || !picked.time) location.replace('index.html');

  var grid = document.getElementById('grid');

  Object.keys(DateInvite.plans).forEach(function (code) {
    var plan = DateInvite.plans[code];
    var tile = document.createElement('a');

    tile.className = 'tile';
    // Внутрішнє посилання без домена: done.html?d=…&t=…&p=…
    tile.href = DateInvite.link('done.html', { p: code });
    tile.innerHTML = '<span class="emoji">' + plan.emoji + '</span>' +
      '<span class="name">' + plan.name + '</span>';

    // Коротка підсвітка вибору, і аж тоді перехід.
    tile.addEventListener('click', function (event) {
      event.preventDefault();
      tile.classList.add('is-picked');
      Track.send('plan', 'выбрала ' + plan.name.toLowerCase());
      setTimeout(function () { location.href = tile.href; }, 180);
    });

    grid.appendChild(tile);
  });
</script>

</body>
</html>
