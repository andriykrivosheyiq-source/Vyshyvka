<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loomiq — мерч для вашої команди: підбір за 1 хвилину</title>
<meta name="description" content="Дайте відповідь на кілька питань, завантажте логотип — і одразу побачите його на одязі вашої команди в кількох варіантах розміщення з прорахунком ціни.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<!--
  КВІЗ ДЛЯ B2B (05.10)

  Андрій: «окремою сторінкою, щоб гнати трафік чисто на квіз». Людина
  відповідає на кілька питань (сфера, скільки людей, який одяг і колір),
  завантажує логотип, лишає контакт — і бачить свій логотип на вибраному
  одязі в кількох варіантах РОЗМІЩЕННЯ (груди зліва, по центру, спина) з
  прорахунком, як у КП.

  Нічого свого про ціни чи зони тут немає:
    • вироби й кольори — catalog-base.js + loomiq/photos (як у каталозі);
    • зони нанесення — SITE_CONTENT.printAreas (ті, що малює адмінка);
    • ціна — LQ.priceOrder з loomiq-pricing.js (той самий рушій, що в КП).
  Заявка — webOrders (Канбан, колонка «Нове») + повідомлення в Telegram.
-->
<style>
  :root{
    --ink:#0B0B0C; --muted:#6B6F76; --line:#E7E8EC; --paper:#FFFFFF; --bg:#F4F5F8;
    --blue:#0369A1; --blue-soft:#E6F1F8; --cta:#C64F08; --cta-dark:#A9430A; --ok:#15803D;
    --radius:20px; --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
    min-height:100vh;}
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  .q-top{display:flex;align-items:center;gap:14px;max-width:1080px;margin:0 auto;padding:18px 16px 10px;}
  .q-logo{font-weight:800;font-size:22px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);}
  .q-logo span{color:var(--blue);}
  .q-bar{flex:1;height:6px;border-radius:6px;background:#E2E4EA;overflow:hidden;}
  .q-bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .35s ease;}
  .q-cnt{font-size:13px;color:var(--muted);white-space:nowrap;}
  .q-wrap{max-width:1080px;margin:0 auto;padding:8px 16px 120px;}
  .q-card{background:var(--paper);border-radius:var(--radius);padding:28px 24px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .q-h{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px;font-weight:800;}
  .q-sub{color:var(--muted);margin:0 0 22px;font-size:16px;line-height:1.45;}
  .q-lbl{display:block;font-weight:600;font-size:14px;margin:18px 0 8px;}
  .q-in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;background:#fff;outline:none;}
  .q-in:focus{border-color:var(--blue);}
  .q-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .q-chip{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;
    font-size:15px;font-weight:600;transition:border-color .15s,background .15s;}
  .q-chip:hover{border-color:#BFC5CF;}
  .q-chip.on{border-color:var(--blue);background:var(--blue-soft);}
  .q-chip small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px;}
  .q-gs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
  .q-g{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px;cursor:pointer;text-align:center;}
  .q-g.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .q-g img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#F6F6F7;display:block;}
  .q-g b{display:block;font-size:14px;margin-top:8px;}
  .q-g .tick{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;
    display:none;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
  .q-g.on .tick{display:flex;}
  .q-g .hint{position:absolute;top:10px;left:10px;background:#FFF4E5;color:#9A4A06;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;}
  .q-cols{display:flex;flex-direction:column;gap:14px;}
  .q-colrow{display:flex;gap:16px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px;}
  .q-colrow img{width:96px;height:96px;object-fit:contain;border-radius:10px;background:#F6F6F7;flex:none;}
  .q-colrow b{display:block;margin-bottom:8px;}
  .q-sw{display:flex;flex-wrap:wrap;gap:8px;}
  .q-sw button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;}
  .q-sw button.on{box-shadow:0 0 0 2.5px var(--blue);}
  .q-cn{font-size:13px;color:var(--muted);margin-top:6px;}
  .q-drop{border:2px dashed #C9CED8;border-radius:18px;padding:34px 18px;text-align:center;cursor:pointer;background:#FAFBFC;}
  .q-drop:hover{border-color:var(--blue);}
  .q-drop b{display:block;font-size:17px;margin-bottom:6px;}
  .q-drop span{color:var(--muted);font-size:14px;}
  .q-logo-pv{display:flex;gap:18px;align-items:center;}
  .q-logo-pv .chk{width:160px;height:160px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
    background:repeating-conic-gradient(#ECEDEF 0% 25%, #fff 0% 50%) 50%/18px 18px;}
  .q-logo-pv img{max-width:86%;max-height:86%;}
  .q-link{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:600;text-decoration:underline;}
  .q-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(244,245,248,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
  .q-nav-in{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;}
  .q-back{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 18px;cursor:pointer;font-weight:600;}
  .q-next{flex:1;border:0;background:var(--cta);color:#fff;border-radius:14px;padding:16px 20px;font-weight:700;font-size:16px;cursor:pointer;}
  .q-next:hover{background:var(--cta-dark);}
  .q-next:disabled{background:#C9CED8;cursor:not-allowed;}
  .q-err{color:#B42318;font-size:14px;margin-top:10px;min-height:18px;}
  .q-note{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.45;}
  .q-busy{display:flex;align-items:center;gap:12px;color:var(--muted);margin-top:14px;}
  .q-spin{width:22px;height:22px;border-radius:50%;border:3px solid #DCE0E6;border-top-color:var(--blue);animation:qs 0.8s linear infinite;}
  @keyframes qs{to{transform:rotate(360deg);}}
  /* ── Результат ── */
  .r-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;}
  .r-sec{background:var(--paper);border-radius:var(--radius);padding:22px 20px;margin-bottom:16px;}
  .r-sec h3{margin:0 0 4px;font-size:20px;}
  .r-sec .meta{color:var(--muted);font-size:14px;margin-bottom:14px;}
  .r-vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .r-v{border:1.5px solid var(--line);border-radius:16px;padding:8px;cursor:pointer;background:#fff;text-align:left;}
  .r-v.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .r-v .pic{position:relative;border-radius:12px;overflow:hidden;background:#F6F6F7;aspect-ratio:1;}
  .r-v .pic img{width:100%;height:100%;object-fit:contain;display:block;}
  .r-v b{display:block;margin:10px 4px 2px;font-size:15px;}
  .r-v span{display:block;margin:0 4px 4px;color:var(--muted);font-size:13px;}
  .r-v em{display:block;margin:4px 4px 2px;font-style:normal;font-weight:700;font-size:16px;}
  .r-qty{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--muted);}
  .r-qty input{width:96px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;}
  .r-calc{position:sticky;top:16px;background:var(--paper);border-radius:var(--radius);padding:20px;}
  .r-calc h3{margin:0 0 12px;font-size:20px;}
  .r-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .r-row div{min-width:0;}
  .r-row b{display:block;font-size:14px;}
  .r-row small{color:var(--muted);}
  .r-row .s{text-align:right;white-space:nowrap;font-weight:600;}
  .r-tot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px;}
  .r-tot b{font-size:26px;letter-spacing:-.02em;}
  .r-tiers{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;color:#3D4249;line-height:1.6;}
  .r-ok{background:#ECFDF3;color:#05603A;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px;line-height:1.45;}
  .r-cta{width:100%;margin-top:14px;}
  a.r-kit{display:block;text-align:center;text-decoration:none;background:var(--blue);box-sizing:border-box;}
  a.r-kit:hover{background:#025a8a;}
  @media (max-width:860px){
    .r-grid{grid-template-columns:1fr;}
    .r-calc{position:static;}
    .q-h{font-size:24px;}
    .q-card{padding:22px 16px;}
  }
  @media (max-width:520px){
    .q-chips{grid-template-columns:1fr;}
    .q-gs{grid-template-columns:repeat(2,minmax(0,1fr));}
    .r-vars{grid-template-columns:repeat(2,minmax(0,1fr));}
    .q-colrow img{width:72px;height:72px;}
    .q-logo-pv .chk{width:120px;height:120px;}
  }
</style>
</head>
<body>
<header class="q-top">
  <a class="q-logo" href="/">loom<span>iq</span></a>
  <div class="q-bar"><i id="qBar"></i></div>
  <div class="q-cnt" id="qCnt"></div>
</header>
<main class="q-wrap" id="qMain"></main>
<nav class="q-nav" id="qNav"><div class="q-nav-in">
  <button class="q-back" id="qBack" type="button">← Назад</button>
  <button class="q-next" id="qNext" type="button">Далі</button>
</div></nav>
<input type="file" id="qFile" accept="image/*,.svg,.pdf" hidden>

<script src="/catalog-base.js"></script>
<script src="/loomiq-pricing.js?v=ae21fbba62"></script>
<script src="/loomiq-mock.js?v=ae21fbba62"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/an.js"></script>
<script src="/loomiq-kit.js?v=ae21fbba62"></script>
<script>
(function(){
  'use strict';
  var W = window, D = document;
  /* Каталог, розміщення, мокап, ціна й заявка — спільні з міні-сайтом
     клієнта (loomiq-kit.js): тут лише кроки квізу. */
  var K = W.LQKit, C = W.SITE_CONTENT;
  var SPHERES = K.SPHERES, esc = K.esc, грн = K.грн, см = K.см, picOf = K.picOf, garments = K.garments, gOf = K.gOf,
      loadImg = K.loadImg, withTimeout = K.withTimeout, frameOf = K.frameOf, placeOn = K.placeOn, placeBox = K.placeBox,
      vinfo = K.vinfo, placesFor = K.placesFor, sizeText = K.sizeText, priced = K.priced, methodFor = K.methodFor,
      phoneNorm = K.phoneNorm, upload = K.upload;
  function renderMock(gid, cid, key, logoIm){ return K.renderMock(gid, cid, key, logoIm, S.logo); }
  function desc(gid, place, units){ return K.desc(gid, MOCKS[gid] && MOCKS[gid][place], units); }
  function lead(context, files){ return K.lead(S.phone, context, files); }
  var PEOPLE = [
    { n:10,  t:'до 10' }, { n:20, t:'10–30' }, { n:40, t:'30–50' },
    { n:75,  t:'50–100' }, { n:150, t:'100–200' }, { n:250, t:'200+' }
  ];
  /* ── Стан (переживає перезавантаження: людина з реклами часто
        відволікається, і починати заново — найпевніший спосіб її втратити) ── */
  var KEY = 'lq_quiz_v1';
  var S = load();
  function load(){
    try{ var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if(s && s.v === 1) return s; }catch(e){}
    return { v:1, step:0, sphere:'', company:'', people:0, garments:[], colors:{}, logo:null,
             wish:'', name:'', phone:'', tg:'', sent:false, pick:{}, qty:{} };
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){   // логотип великий — зберігаємо без нього, решта відповідей важливіша
      try{ var c = JSON.parse(JSON.stringify(S)); c.logo = null; localStorage.setItem(KEY, JSON.stringify(c)); }catch(e2){}
    }
  }
  var RAW = null;          // оригінал логотипа (у памʼяті — для виробництва)
  var MOCKS = {};          // gid → { place → { url (dataURL), wCm, hCm, mm2 } }

  function track(name, p){ try{ W.lqAn && W.lqAn.track(name, p || {}); }catch(e){} }

  function colorOf(gid){
    var g = gOf(gid); if(!g) return null;
    return g.colors.filter(function(c){ return c.id === S.colors[gid]; })[0] || g.colors[0];
  }

  /* ── Кроки ── */
  /* Андрій (06.10): «у квізі обирати одяг не потрібно» — після контакту
     людина одразу йде у свій каталог (/k/), де весь одяг уже з її лого.
     Крок «result» лишився запасним: якщо логотип не вдалось покласти в
     хмару, посилання на каталог не буде — тоді показуємо варіанти тут. */
  var STEPS = ['sphere', 'people', 'logo', 'contact', 'result'];
  function go(n){
    S.step = Math.max(0, Math.min(STEPS.length - 1, n));
    save(); render(); W.scrollTo(0, 0);
    track('quiz_step', { step: STEPS[S.step] });
  }
  function render(){
    var st = STEPS[S.step];
    var main = D.getElementById('qMain');
    var q = STEPS.length - 1;
    D.getElementById('qBar').style.width = Math.round(Math.min(S.step, q) / q * 100) + '%';
    D.getElementById('qCnt').textContent = st === 'result' ? 'Готово' : ('Крок ' + (S.step + 1) + ' з ' + q);
    D.getElementById('qBack').style.visibility = S.step > 0 && st !== 'result' ? 'visible' : 'hidden';
    D.getElementById('qNav').hidden = st === 'result';
    main.innerHTML = VIEWS[st]();
    if(BIND[st]) BIND[st](main);
    nextState();
  }
  function nextState(){
    var st = STEPS[S.step], b = D.getElementById('qNext');
    b.textContent = st === 'contact' ? 'Відкрити мій каталог' : 'Далі';
    b.disabled = !ready(st);
  }
  function ready(st){
    if(st === 'sphere') return !!S.sphere;
    if(st === 'people') return S.people > 0;
    if(st === 'garments') return S.garments.length > 0;
    if(st === 'colors') return true;
    if(st === 'logo') return !!S.logo && !busy;
    if(st === 'contact') return !!phoneNorm(S.phone) && String(S.name).trim().length > 1 && !busy;
    return false;
  }
  var busy = false;

  var VIEWS = {
    sphere: function(){
      return '<div class="q-card"><h1 class="q-h">Побачте свій логотип на одязі команди — за хвилину</h1>' +
        '<p class="q-sub">Три питання й логотип — і ви отримаєте свій каталог: футболки, худі, кепки й шопери вже з вашим логотипом і цінами на вашу команду.</p>' +
        '<label class="q-lbl">Чим займається ваша компанія?</label><div class="q-chips">' +
        SPHERES.map(function(s){ return '<button class="q-chip' + (S.sphere === s.id ? ' on' : '') + '" data-sp="' + s.id + '">' + esc(s.name) + '</button>'; }).join('') +
        '</div><label class="q-lbl" for="qCo">Назва компанії <span style="font-weight:400;color:var(--muted)">(необовʼязково)</span></label>' +
        '<input class="q-in" id="qCo" maxlength="80" placeholder="Наприклад, «Кава на розі»" value="' + esc(S.company) + '"></div>';
    },
    people: function(){
      var own = S.people && !PEOPLE.some(function(p){ return p.n === S.people; });
      return '<div class="q-card"><h2 class="q-h">Скільки людей у команді вдягнемо?</h2>' +
        '<p class="q-sub">Від кількості залежить ціна: що більший тираж, то дешевша кожна річ.</p><div class="q-chips">' +
        PEOPLE.map(function(p){ return '<button class="q-chip' + (S.people === p.n ? ' on' : '') + '" data-pp="' + p.n + '">' + esc(p.t) + ' <small>людей</small></button>'; }).join('') +
        '</div><label class="q-lbl" for="qPp">Або точна кількість</label>' +
        '<input class="q-in" id="qPp" type="number" min="1" max="5000" inputmode="numeric" placeholder="Наприклад, 35" value="' + (own ? S.people : '') + '"></div>';
    },
    garments: function(){
      var sp = SPHERES.filter(function(s){ return s.id === S.sphere; })[0] || { g:[] };
      return '<div class="q-card"><h2 class="q-h">Який одяг вам потрібен?</h2>' +
        '<p class="q-sub">Можна обрати кілька — порахуємо разом, і спільний тираж зробить кожну річ дешевшою.</p><div class="q-gs">' +
        garments().map(function(g){
          var c = colorOf(g.id) || g.colors[0];
          return '<button class="q-g' + (S.garments.indexOf(g.id) >= 0 ? ' on' : '') + '" data-g="' + esc(g.id) + '">' +
            (sp.g.indexOf(g.id) >= 0 ? '<span class="hint">Часто беруть</span>' : '') + '<span class="tick">✓</span>' +
            '<img loading="lazy" alt="" src="' + esc(picOf(g.id, c.id, 'front')) + '"><b>' + esc(g.name) + '</b></button>';
        }).join('') + '</div></div>';
    },
    colors: function(){
      return '<div class="q-card"><h2 class="q-h">Оберіть колір</h2>' +
        '<p class="q-sub">Колір — з нашої палітри для кожного виробу. Потім легко змінити.</p><div class="q-cols">' +
        S.garments.map(function(gid){
          var g = gOf(gid); if(!g) return '';
          var c = colorOf(gid);
          return '<div class="q-colrow"><img alt="" src="' + esc(picOf(gid, c.id, 'front')) + '" data-pv="' + esc(gid) + '"><div>' +
            '<b>' + esc(g.name) + '</b><div class="q-sw">' + g.colors.map(function(x){
              return '<button title="' + esc(x.name) + '" aria-label="' + esc(x.name) + '" class="' + (x.id === c.id ? 'on' : '') +
                '" style="background:' + esc(x.hex || '#ccc') + '" data-cg="' + esc(gid) + '" data-cc="' + esc(x.id) + '"></button>';
            }).join('') + '</div><div class="q-cn" data-cn="' + esc(gid) + '">' + esc(c.name) + '</div></div></div>';
        }).join('') + '</div></div>';
    },
    logo: function(){
      return '<div class="q-card"><h2 class="q-h">Завантажте логотип</h2>' +
        '<p class="q-sub">Підійде будь-який файл: PNG, JPG, SVG, навіть фото. Фон приберемо самі.</p>' +
        (S.logo ? '<div class="q-logo-pv"><div class="chk"><img alt="Ваш логотип" src="' + esc(S.logo.url) + '"></div><div>' +
          '<b>' + esc(S.logo.file || 'Логотип') + '</b><p class="q-note">Так логотип ляже на одяг. Якщо фон прибрався не так — не страшно, дизайнер підготує макет вручну.</p>' +
          '<button class="q-link" data-up>Завантажити інший</button></div></div>'
          : '<div class="q-drop" data-up tabindex="0"><b>Обрати файл</b><span>або перетягніть його сюди</span></div>') +

    contact: function(){
      return '<div class="q-card"><h2 class="q-h">Куди надіслати ваш каталог?</h2>' +

        '<label class="q-lbl" for="qPhone">Телефон</label><input class="q-in" id="qPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380 __ ___ __ __" value="' + esc(S.phone) + '">' +
        '<label class="q-lbl" for="qTg">Telegram чи Instagram <span style="font-weight:400;color:var(--muted)">(необовʼязково)</span></label>' +

        '<p class="q-note">Натискаючи кнопку, ви погоджуєтесь, що ми звʼяжемося з вами щодо замовлення. Без розсилок.</p></div>';
    },

  };

  var BIND = {
    sphere: function(m){
      m.querySelectorAll('[data-sp]').forEach(function(b){ b.onclick = function(){

        var c = colorOf(gid);

    logo: function(m){

      if(drop){

      }
      var w = m.querySelector('#qWish'); w.oninput = function(){ S.wish = w.value.slice(0, 500); save(); };
    },
    contact: function(m){

        var el = m.querySelector('#q' + k);

  D.getElementById('qBack').onclick = function(){ if(!busy) go(S.step - 1); };
  D.getElementById('qNext').onclick = function(){
    var st = STEPS[S.step];
    if(!ready(st)) return;
    if(st === 'garments'){
      S.garments.forEach(function(gid){ if(!S.colors[gid]){ var g = gOf(gid); if(g) S.colors[gid] = popular(g); } });
    }
    if(st === 'contact') return submit();
    go(S.step + 1);
  };
  D.getElementById('qFile').onchange = function(e){ var f = e.target.files && e.target.files[0]; e.target.value = ''; if(f) takeFile(f); };
  function popular(g){
    var pref = ['black', 'white'];
    for(var i = 0; i < pref.length; i++) if(g.colors.some(function(c){ return c.id === pref[i]; })) return pref[i];
    return g.colors[0].id;
  }

  /* ══════════ ЛОГОТИП ══════════
     Фон знімаємо тим самим шляхом, що й конструктор (Photoroom через наш
     воркер, інакше — власний алгоритм). Потім обрізаємо прозорі поля: без
     цього «9 см на серці» означали б 9 см разом з порожнечею навколо. */
  function readFile(f){
    return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = rej; r.readAsDataURL(f); });
  }
  function hasAlpha(im){
    var c = D.createElement('canvas'), k = Math.min(1, 200 / Math.max(im.naturalWidth, im.naturalHeight));
    c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
    var x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
    var a = x.getImageData(0, 0, c.width, c.height).data, n = 0;
    for(var i = 3; i < a.length; i += 4) if(a[i] < 200) n++;
    return n > (a.length / 4) * 0.03;
  }
  /* Обрізка по непрозорому + частка «чорнила» (для площі вишивки). */
  function trim(im){
    var MAX = 900;
    var k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
    var w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
    var c = D.createElement('canvas'); c.width = w; c.height = h;
    var x = c.getContext('2d'); x.drawImage(im, 0, 0, w, h);
    var a = x.getImageData(0, 0, w, h).data;
    var x0 = w, y0 = h, x1 = -1, y1 = -1;
    for(var y = 0; y < h; y++) for(var xx = 0; xx < w; xx++){
      if(a[(y * w + xx) * 4 + 3] > 24){ if(xx < x0) x0 = xx; if(xx > x1) x1 = xx; if(y < y0) y0 = y; if(y > y1) y1 = y; }
    }
    if(x1 < x0){ x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
    var tw = x1 - x0 + 1, th = y1 - y0 + 1, ink = 0;
    for(var yy = y0; yy <= y1; yy++) for(var x2 = x0; x2 <= x1; x2++) if(a[(yy * w + x2) * 4 + 3] > 24) ink++;
    var o = D.createElement('canvas'); o.width = tw; o.height = th;
    o.getContext('2d').drawImage(c, x0, y0, tw, th, 0, 0, tw, th);
    return { url: o.toDataURL('image/png'), ar: th / tw, ink: Math.max(0.05, ink / (tw * th)) };
  }
  function takeFile(f){
    var err = D.getElementById('qErr');
    if(f.size > 25 * 1024 * 1024){ if(err) err.textContent = 'Файл більший за 25 МБ — оберіть, будь ласка, менший.'; return; }
    if(/pdf/i.test(f.type)){ if(err) err.textContent = 'PDF покажемо менеджеру, але для превʼю потрібна картинка (PNG, JPG чи SVG).'; return; }
    busy = true; render();
    var name = f.name;
    readFile(f).then(function(raw){
      RAW = { url: raw, name: name };
      return loadImg(raw).then(function(im){
        if(!im) throw new Error('bad');
        if(hasAlpha(im) || /svg/i.test(f.type)) return im;
        var M = W.LQMock;
        if(!M) return im;
        M.host = { bgUrl: function(){ return ((C.bgApi || {}).proxyUrl || '').trim(); } };
        return withTimeout(M.removeBg(raw, 'photoroom'), 15000)
          .catch(function(){ return withTimeout(M.removeBg(raw, 'local'), 8000); })
          .then(loadImg).then(function(x){ return x || im; })
          .catch(function(){ return im; });
      });
    }).then(function(im){
      var t = trim(im);
      S.logo = { url: t.url, ar: t.ar, ink: t.ink, file: name };
      MOCKS = {};
      track('quiz_logo');
    }).catch(function(){
      setTimeout(function(){ var e2 = D.getElementById('qErr'); if(e2) e2.textContent = 'Не вдалось відкрити файл. Спробуйте PNG чи JPG.'; }, 0);
    }).then(function(){ busy = false; save(); render(); });
  }

  function buildMocks(){
    return loadImg(S.logo.url).then(function(logoIm){
      var jobs = [];
      S.garments.forEach(function(gid){
        var c = colorOf(gid); if(!c) return;
        MOCKS[gid] = MOCKS[gid] || {};
        placesFor(gid).forEach(function(pl){
          if(MOCKS[gid][pl] && MOCKS[gid][pl].cid === c.id) return;
          jobs.push(renderMock(gid, c.id, pl, logoIm).then(function(r){ if(r){ r.cid = c.id; MOCKS[gid][pl] = r; } else delete MOCKS[gid][pl]; }));
        });
      });
      return Promise.all(jobs);
    });
  }

  function qtyOf(gid){ return Math.max(1, +S.qty[gid] || S.people || 1); }
  function pickOf(gid){
    var pl = placesFor(gid);
    return pl.indexOf(S.pick[gid]) >= 0 ? S.pick[gid] : (pl.indexOf('center') >= 0 ? 'center' : pl[0]);
  }
  /* Ціна за штуку для кожного варіанту — у складі з рештою вибраного:
     спільний тираж і один макет на все замовлення, як у КП. */
  function priceTable(scale){
    if(!S.garments.every(function(gid){ return K.hasPrice(gid); })) return null;
    var list = S.garments.map(function(gid){ return desc(gid, pickOf(gid), Math.round(qtyOf(gid) * (scale || 1))); });
    return W.LQ.priceOrder(list);
  }
  function variantPrice(gid, place){
    if(!S.garments.every(function(g){ return K.hasPrice(g); })) return null;
    var list = S.garments.map(function(g){ return desc(g, g === gid ? place : pickOf(g), qtyOf(g)); });
    var r = W.LQ.priceOrder(list);
    return r[S.garments.indexOf(gid)];
  }

  /* ══════════ КОНТАКТ → ЗАЯВКА ══════════
     Порядок навмисний. Спершу — коротке повідомлення в Telegram з
     контактом: воно доходить за секунду, і навіть якщо людина закриє
     вкладку, менеджер уже знає, кому дзвонити. Потім показуємо варіанти, а
     у фоні вантажимо мокапи й логотип у хмару й пишемо замовлення в Канбан. */
  function sphereName(){ return (SPHERES.filter(function(s){ return s.id === S.sphere; })[0] || {}).name || ''; }
  function summary(){
    return S.garments.map(function(gid){
      var g = gOf(gid) || { name: gid }, c = colorOf(gid) || { name:'' };
      var pl = pickOf(gid), mk = MOCKS[gid] && MOCKS[gid][pl];
      var v = vinfo(gid, pl);
      return '• ' + g.name + ', ' + c.name + ' — ' + qtyOf(gid) + ' шт · ' + v.name.toLowerCase() +
        (v.boxes ? ' (' + v.d + ')' : '') + (mk ? ' ' + sizeText(mk) : '');
    }).join('\n');
  }
  function leadText(head){
    var pt = priceTable(), tot = pt ? pt.reduce(function(s, r){ return s + (r.sum || 0); }, 0) : 0;
    return head + '\n' +
      (S.company ? 'Компанія: ' + S.company + '\n' : '') +
      'Сфера: ' + sphereName() + ' · людей: ' + S.people + '\n' +
      'Імʼя: ' + String(S.name).trim() + (S.tg ? ' · ' + String(S.tg).trim() : '') + '\n' +
      summary() + (tot ? '\nОрієнтовно: ' + грн(tot) : '') +
      (S.wish ? '\nПобажання: ' + S.wish : '');
  }
  function submit(){
    var err = D.getElementById('qErr');
    if(!phoneNorm(S.phone)){ if(err) err.textContent = 'Перевірте номер телефону: потрібен український, +380…'; return; }
    busy = true; render();
    S.name = String(S.name).trim().slice(0, 60);
    /* Одяг не обирали — у картку менеджеру кладемо типовий набір сфери. */
    var sp = SPHERES.filter(function(x){ return x.id === S.sphere; })[0] || { g: [] };
    S.garments = (sp.g.length ? sp.g : ['tee', 'hoodie', 'cap']).filter(function(g){ return gOf(g); });
    if(!S.garments.length) S.garments = garments().slice(0, 3).map(function(g){ return g.id; });
    S.garments.forEach(function(gid){ if(!S.colors[gid]){ var g = gOf(gid); if(g) S.colors[gid] = popular(g); } });
    save();
    lead(leadText('🧩 Квіз: нова заявка'));
    track('quiz_contact');
    try{ W.lqAn && W.lqAn.step('lead'); }catch(e){}
    buildMocks().catch(function(){}).then(saveOrder).catch(function(){}).then(function(){
      busy = false; S.sent = true; save();
      if(S.kit){ track('quiz_kit'); location.href = S.kit; return; }
      go(STEPS.indexOf('result'));
    });
  }
  var ORDER_SAVED = false;
  function saveOrder(){
    if(ORDER_SAVED) return Promise.resolve();
    ORDER_SAVED = true;
    var logoUp = upload(S.logo && S.logo.url);
    var rawUp = RAW && RAW.url && RAW.url !== (S.logo && S.logo.url) ? upload(RAW.url) : Promise.resolve(null);
    var mockUps = [];
    /* Лише мокап основного варіанту: людина чекає на перехід у каталог,
       а решту варіантів менеджер побачить там само за посиланням. */
    S.garments.forEach(function(gid){
      var mk = MOCKS[gid] && MOCKS[gid][pickOf(gid)];
      if(mk && mk.url && !mk.up) mockUps.push(upload(mk.url).then(function(u){ mk.up = u; }));
    });
    return Promise.all([logoUp, rawUp].concat(mockUps)).then(function(r){
      var logoUrl = r[0], rawUrl = r[1];
      var pt = priceTable() || [];
      var items = S.garments.map(function(gid, i){
        var g = gOf(gid) || { name: gid }, c = colorOf(gid) || { id:'', name:'' };
        var pl = pickOf(gid), mk = (MOCKS[gid] || {})[pl] || {};
        var others = placesFor(gid).filter(function(x){ return x !== pl; });
        var row = pt[i] || {};
        return {
          kind: 'quiz', name: g.name, color: c.name, print: methodFor(gid) === 'embro' ? 'Вишивка' : 'DTF', sizes: '',
          qty: qtyOf(gid), unitPrice: Math.round(row.unit || 0), price: Math.round(row.sum || 0), unitCost: 0, cost: 0,
          mockups: [mk.up].concat(others.map(function(x){ return ((MOCKS[gid] || {})[x] || {}).up; })).filter(Boolean),
          prints: (mk.parts || [{ side: vinfo(gid, pl).sides[0], wCm: mk.wCm, hCm: mk.hCm }]).map(function(q){
            return { side: q.side, technique: methodFor(gid) === 'embro' ? 'Вишивка' : 'DTF',
                     widthMm: Math.round((q.wCm || 0) * 10), heightMm: Math.round((q.hCm || 0) * 10),
                     place: vinfo(gid, pl).name, file: rawUrl || logoUrl || null }; }),
          config: { garmentId: gid, colorId: c.id, printId: methodFor(gid), qty: qtyOf(gid), logos: {} }
        };
      });
      var total = items.reduce(function(s, x){ return s + x.price; }, 0);
      /* Персональний каталог клієнта (/k/): логотип уже в хмарі — можна
         дати посилання, яке відкриється на будь-якому пристрої. */
      if(logoUrl){
        S.kit = K.kitLink({ company: S.company, sphere: S.sphere, people: S.people, logo: logoUrl, ar: S.logo.ar, ink: S.logo.ink,
                            garments: S.garments, colors: S.colors });
        save(); try{ var rc = D.getElementById('rCalc'); if(rc){ rc.innerHTML = calcHtml(); bindCalc(D.getElementById('qMain')); } }catch(e){}
      }
      var order = {
        orderId: 'Q' + Date.now().toString(36).toUpperCase(),
        name: S.name || 'Квіз', phone: phoneNorm(S.phone), site: 'quiz', items: items,
        totalPrice: total, totalCost: 0, page: location.pathname,
        note: ('Квіз (одяг не обирали — набір за сферою; що сподобається, клієнт складе в кошик каталогу) · ' +
               (S.company ? S.company + ' · ' : '') + sphereName() + ' · людей: ' + S.people +
               (S.tg ? ' · ' + String(S.tg).trim() : '') + (S.wish ? ' · побажання: ' + S.wish : '') +
               (logoUrl ? ' · логотип: ' + logoUrl : '') + (S.kit ? ' · каталог клієнта: ' + S.kit : '')).slice(0, 1800),
        quiz: { company: S.company, sphere: S.sphere, people: S.people, tg: S.tg, wish: S.wish, logo: logoUrl, logoRaw: rawUrl },
        createdAt: new Date().toISOString(), imported: false,
        an: (W.lqAn && W.lqAn.attribution && W.lqAn.attribution()) || null
      };
      var files = [];
      if(rawUrl || logoUrl) files.push({ url: rawUrl || logoUrl, kind:'logo', caption:'Логотип клієнта' });
      items.forEach(function(it){ if(it.mockups[0]) files.push({ url: it.mockups[0], kind:'mockup', caption: it.name + ', ' + it.color }); });
      var write = K.addOrder(order);
      return write.then(function(){
        lead('🧩 Квіз: мокапи й прорахунок для ' + S.name + ' (картка вже в Канбані, «Нове»)\n' + summary() +
             (S.kit ? '\nКаталог клієнта: ' + S.kit : ''), files);
      }, function(e){
        lead('⚠️ Квіз: заявка НЕ потрапила в Канбан (' + ((e && (e.code || e.message)) || 'помилка') + '). Заведіть картку вручну.\n' +
             leadText(''), files);
      });
    });
  }

  /* ══════════ РЕЗУЛЬТАТ ══════════ */
  function resultHtml(){
    if(!S.logo || !S.garments.length) return '<div class="q-card"><h2 class="q-h">Почнімо спочатку</h2><button class="q-next" data-restart>Пройти квіз</button></div>';
    var secs = S.garments.map(function(gid){
      var g = gOf(gid) || { name: gid }, c = colorOf(gid) || { name:'' };
      var cur = pickOf(gid);
      return '<section class="r-sec"><h3>' + esc(g.name) + '</h3><div class="meta">' + esc(c.name) +
        ' · ' + (methodFor(gid) === 'embro' ? 'вишивка' : 'DTF-друк') + '</div><div class="r-vars">' +
        placesFor(gid).map(function(pl){
          var mk = (MOCKS[gid] || {})[pl];
          var pr = variantPrice(gid, pl);
          return '<button class="r-v' + (pl === cur ? ' on' : '') + '" data-vg="' + esc(gid) + '" data-vp="' + pl + '">' +
            '<div class="pic">' + (mk ? mockImg(mk) : '') + '</div>' +
            '<b>' + esc(vinfo(gid, pl).name) + '</b><span>' + (vinfo(gid, pl).boxes ? esc(vinfo(gid, pl).d) + (mk ? ' · ' : '') : '') +
            (mk ? sizeText(mk) : '') + (!vinfo(gid, pl).boxes && vinfo(gid, pl).d ? ' · ' + esc(vinfo(gid, pl).d) : '') + '</span>' +
            (pr && pr.unit ? '<em>' + грн(pr.unit) + ' / шт</em>' : '') + '</button>';
        }).join('') + '</div>' +
        '<label class="r-qty">Кількість <input type="number" min="1" max="5000" inputmode="numeric" data-qg="' + esc(gid) + '" value="' + qtyOf(gid) + '"> шт</label>' +
        '</section>';
    }).join('');
    return '<div class="q-card" style="margin-bottom:16px"><h1 class="q-h">Ваш логотип на одязі команди</h1>' +
      '<p class="q-sub">Оберіть розміщення для кожного виробу — прорахунок оновиться сам. ' +
      'Менеджер уже отримав вашу заявку й напише найближчим часом.</p></div>' +
      '<div class="r-grid"><div>' + secs + '</div><aside class="r-calc" id="rCalc">' + calcHtml() + '</aside></div>';
  }
  function mockImg(mk){
    if(mk.url) return '<img alt="" src="' + esc(mk.url) + '">';
    /* Полотно недоступне (фото з чужого домену без CORS) — фото + логотип зверху. */
    return '<img alt="" src="' + esc(mk.photo) + '"><img alt="" src="' + esc(S.logo.url) + '" style="position:absolute;left:' +
      ((mk.p.cx - mk.p.w / 2) * 100) + '%;top:' + ((mk.p.cy) * 100) + '%;width:' + (mk.p.w * 100) + '%;height:auto;transform:translateY(-50%)">';
  }
  function calcHtml(){
    var pt = priceTable();
    if(!pt) return '<h3>Прорахунок</h3><p class="q-note">Ціну за вашим вибором менеджер надішле особисто — ' +
      'вона залежить від розміру логотипа й тиражу.</p>';
    var tot = 0, units = 0;
    var rows = S.garments.map(function(gid, i){
      var g = gOf(gid) || { name: gid }, c = colorOf(gid) || { name:'' }, r = pt[i] || {};
      var pl = pickOf(gid), mk = (MOCKS[gid] || {})[pl];
      tot += r.sum || 0; units += qtyOf(gid);
      var v = vinfo(gid, pl);
      return '<div class="r-row"><div><b>' + esc(g.name) + '</b><small>' + esc(c.name) + ' · ' + esc(v.name.toLowerCase()) +
        (v.boxes ? ' (' + esc(v.d) + ')' : '') + (mk ? ' ' + esc(sizeText(mk)) : '') + '<br>' + qtyOf(gid) + ' шт × ' + грн(r.unit) + '</small></div>' +
        '<div class="s">' + грн(r.sum) + '</div></div>';
    }).join('');
    /* «Що більше — то дешевше»: та сама позиція при більшому тиражі. */
    var steps = [2, 4].map(function(k){
      var p2 = priceTable(k); if(!p2) return '';
      var t2 = p2.reduce(function(s, r){ return s + (r.sum || 0); }, 0), u2 = 0;
      S.garments.forEach(function(gid){ u2 += Math.round(qtyOf(gid) * k); });
      var avgNow = tot / Math.max(1, units), avg2 = t2 / Math.max(1, u2);
      return avg2 < avgNow - 1 ? 'При ' + u2 + ' шт — у середньому <b>' + грн(avg2) + '</b> за річ (зараз ' + грн(avgNow) + ')' : '';
    }).filter(Boolean);
    return '<h3>Прорахунок</h3>' + rows +
      '<div class="r-tot"><span>Разом</span><b>' + грн(tot) + '</b></div>' +
      '<p class="q-note" style="margin-top:0">' + units + ' шт · підготовка макета вишивки вже в ціні. Ціна орієнтовна — ' +
      'остаточну менеджер підтвердить після перевірки логотипа.</p>' +
      (steps.length ? '<div class="r-tiers">' + steps.join('<br>') + '</div>' : '') +
      (S.chosen ? '<div class="r-ok">Дякуємо! Ваш вибір передали менеджеру — він звʼяжеться з вами найближчим часом.</div>'
                : '<button class="q-next r-cta" data-choose>Обираю ці варіанти</button>') +
      (S.kit ? '<a class="q-next r-cta r-kit" href="' + esc(S.kit) + '">Відкрити мій каталог з логотипом →</a>' +
        '<p class="q-note" style="margin-top:6px">Усі вироби з вашим логотипом, кольори й варіанти — збережіть посилання.</p>' : '') +
      '<p class="q-note"><button class="q-link" data-restart>Пройти квіз ще раз</button></p>';
  }
  function bindResult(m){
    m.querySelectorAll('[data-restart]').forEach(function(b){ b.onclick = function(){
      var keep = { name: S.name, phone: S.phone, tg: S.tg };
      S = { v:1, step:0, sphere:'', company:'', people:0, garments:[], colors:{}, logo:null, wish:'',
            name: keep.name, phone: keep.phone, tg: keep.tg, sent:false, pick:{}, qty:{} };
      MOCKS = {}; ORDER_SAVED = false; go(0);
    }; });
    m.querySelectorAll('[data-vg]').forEach(function(b){ b.onclick = function(){
      S.pick[b.dataset.vg] = b.dataset.vp; S.chosen = false; save();
      m.querySelectorAll('[data-vg="' + b.dataset.vg + '"]').forEach(function(x){ x.classList.toggle('on', x === b); });
      refreshCalc(m);
    }; });
    m.querySelectorAll('[data-qg]').forEach(function(inp){ inp.oninput = function(){
      var n = Math.max(0, Math.min(5000, Math.round(+inp.value || 0)));
      if(n > 0){ S.qty[inp.dataset.qg] = n; S.chosen = false; save(); refreshCalc(m); refreshPrices(m); }
    }; });
    bindCalc(m);
    /* Відкрили результат після перезавантаження — мокапів у памʼяті вже
       немає. Будуємо заново (заявку повторно не шлемо). */
    var missing = S.garments.some(function(gid){ return !MOCKS[gid] || placesFor(gid).some(function(pl){ return !MOCKS[gid][pl]; }); });
    if(missing && S.logo && !m.__rebuilding){ m.__rebuilding = true; buildMocks().then(function(){ render(); }); }
  }
  function refreshPrices(m){
    m.querySelectorAll('[data-vg]').forEach(function(b){
      var pr = variantPrice(b.dataset.vg, b.dataset.vp), em = b.querySelector('em');
      if(em && pr) em.textContent = грн(pr.unit) + ' / шт';
    });
  }
  function refreshCalc(m){ var c = m.querySelector('#rCalc'); if(c){ c.innerHTML = calcHtml(); bindCalc(m); } }
  function bindCalc(m){
    var ch = m.querySelector('[data-choose]');
    if(ch) ch.onclick = function(){
      S.chosen = true; save(); refreshCalc(m);
      track('quiz_choose');
      lead(leadText('✅ Квіз: клієнт обрав варіанти'));
    };
    m.querySelectorAll('#rCalc [data-restart]').forEach(function(b){ b.onclick = m.querySelector('[data-restart]').onclick; });
  }

  /* ══════════ СТАРТ ══════════ */
  var started = false;
  function start(){ started = true; render(); }
  K.boot(start);
  /* Результат без контакту не показуємо: людина, що повернулась на крок
     «результат» з чужого пристрою чи після очищення, починає з контактів. */
  if(STEPS[S.step] === 'result' && !S.sent) S.step = STEPS.indexOf('contact');
  W.__quiz = { state: function(){ return S; }, mocks: function(){ return MOCKS; }, priceTable: priceTable, placeOn: placeOn, placeBox: placeBox, frameOf: frameOf };
})();
</script>
</body>
</html>
