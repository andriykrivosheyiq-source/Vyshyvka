     «Редагувати» була переносом між ними, і кожен перенос щось губив: то
     розмір нанесення, то ціну, то термін, то тираж. Тут переносу немає:
     жива модель одна, а пропозиція для клієнта — просто її вигляд.

     Клієнтський вигляд лишається окремим і зовсім іншим: він на вкладці
     «Як бачить клієнт», і це та сама сторінка, яку відкриє клієнт. */
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:#F1F4F8; color:#1B2536; display:flex; flex-direction:column; overflow:hidden;}
  .tabs{flex:none; display:flex; background:#EEF2F7; border-radius:9px; padding:3px; gap:2px;
    margin:10px 10px 0;}
  .tab{flex:1; font:inherit; font-size:12px; font-weight:700; color:#5A6A80; background:none;
    border:0; border-radius:7px; padding:8px 6px; cursor:pointer; white-space:nowrap;}
  .tab.on{background:#fff; color:#1B2536; box-shadow:0 1px 3px rgba(16,32,56,.12);}
  .save{flex:none; font-size:11.5px; font-weight:700; color:#7A879B; padding:7px 12px 0;
    min-height:19px;}
  .save.is-saving{color:#B7791F;} .save.is-ok{color:#0E9F6E;} .save.is-bad{color:#C6392F;}
  .btn{font:inherit; font-size:12.5px; font-weight:700; border-radius:9px; padding:9px 14px;
    cursor:pointer; border:1px solid #D9E1EC; background:#fff; color:#3D4C61; white-space:nowrap;}
  .btn:hover{border-color:#4F5FD4; color:#3A48A8;}
  .btn-main{background:#1F2C44; border-color:#1F2C44; color:#fff;}
  .btn-main:hover{background:#2C3B58; border-color:#2C3B58; color:#fff;}
  .btn:disabled{opacity:.5; cursor:default;}

  .body{flex:1; min-height:0; display:flex;}
  /* Стрічка позицій. Конструктор у нас один на сторінку — його вузли мають
     унікальні id, — тож розгорнутою може бути лише одна позиція. Решта
     стоять компактними рядками: видно весь склад замовлення, а клік
     перемикає, яку саме зараз збираємо. Кнопки «Редагувати» немає: перехід
     до позиції і є її редагування. */
  .list{flex:0 0 250px; min-width:0; background:#fff; border-right:1px solid #E2E8F0;
    display:flex; flex-direction:column;}
  .list-h{flex:none; font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    color:#8A93A3; padding:12px 14px 7px;}
  .list-b{flex:1; overflow:auto; padding:0 8px 8px;}
  .it{display:flex; gap:9px; align-items:center; padding:8px; border-radius:10px; cursor:pointer;
    border:1px solid transparent;}
  .it:hover{background:#F4F7FB;}
  .it.on{background:#EEF2FF; border-color:#C7D2FE;}
  .it-th{flex:none; width:42px; height:42px; border-radius:8px; background:#F1F4F8;
    overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .it-th img{width:100%; height:100%; object-fit:contain; display:block;}
  .it-t{flex:1; min-width:0;}
  /* Назва зверху, цифри під нею. Обидва були inline і злипались в один
     рядок: «Футболка базова1 шт · 2 024 грн/шт». */
  .it-n{display:block; font-size:12.5px; font-weight:700; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .it-m{display:block; font-size:11px; color:#7A879B; margin-top:3px;
    font-variant-numeric:tabular-nums;}
  .it-todo{color:#C2410C; font-weight:700;}
  /* Позиція-варіант: клієнт її ще не додав. У списку це має читатись з
     першого погляду — інакше менеджер рахує суму, якої в кошторисі немає. */
  .it-opt{margin-left:6px; font-size:9.5px; font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; color:#7A6538; background:#FDF0D5; border-radius:5px;
    padding:1px 5px; vertical-align:1px;}
  /* Розклад ціни просто в списку. «Дві однакові позиції, а ціни різні» —
     найчастіше питання менеджера, і доти відповідь на нього лежала тільки
     всередині картки: щоб порівняти дві, треба було відкрити одну,
     запамʼятати числа, відкрити другу. Тепер обидві розкриваються поруч, і
     видно, чим саме вони відрізняються: площею нанесення, окремим ескізом
     чи порогом тиражу. */
  .it-why{display:inline-block; margin-top:4px; font:inherit; font-size:10.5px; font-weight:700;
    letter-spacing:.03em; text-transform:uppercase; color:#5B6B80; background:none;
    border:0; border-bottom:1px dashed #B8C2D0; padding:0 0 1px; cursor:pointer;}
  .it-why:hover{color:#1B2536; border-bottom-color:#5B6B80;}
  .it-calc{margin:1px 0 8px 59px; padding:8px 10px; border-radius:9px; background:#F7F9FC;
    border:1px solid #E6ECF4; font-size:11px; color:#4A5A72; font-variant-numeric:tabular-nums;}
  .it-calc div{display:flex; gap:10px; justify-content:space-between; padding:2px 0; line-height:1.35;}
  .it-calc div span:first-child{min-width:0; word-break:break-word;}
  .it-calc div span:last-child{flex:none; font-weight:600; color:#1B2536; white-space:nowrap;}
  .it-calc .is-sub{padding-left:9px; color:#8A93A3;}
  .it-calc .is-disc span:last-child{color:#0F7A3D;}
  .it-calc .is-sum{border-top:1px solid #E2E8F0; margin-top:4px; padding-top:5px;}
  .it-calc .is-sum span{font-weight:800; color:#1B2536;}
  /* Окремий ескіз у складі — найчастіша причина «однакові позиції, різні
     ціни». Іноді він справедливий (справді другий малюнок), іноді це слід
     видаленого логотипа. Кнопка стоїть саме тут, де питання й виникає, а не
     на вкладці клієнта, куди менеджер під час збирання не заходить. */
  .fpfix-box{margin-top:10px; padding:9px 10px; border-radius:10px;
    background:#FFF8EC; border:1px solid #F3DFB8;}
  .fpfix-box button{width:100%;}
  .fpfix-h{margin:7px 0 0; font-size:11px; line-height:1.4; color:#7A6538;}
  .it-r{font-size:11px; font-weight:700; color:#8A93A3; text-transform:uppercase; letter-spacing:.04em;}
  .list-sec{font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    color:#8A93A3; padding:14px 8px 6px;}
  .list-add{width:100%; margin-top:8px;}
  .list-f{flex:none; border-top:1px solid #E2E8F0; padding:10px 12px; font-size:12px; color:#5A6A80;}
  .list-f b{display:block; font-size:18px; font-weight:800; letter-spacing:-.3px;
    color:#1B2536; margin-top:2px; font-variant-numeric:tabular-nums;}
  .list-f span{display:block; font-size:11.5px; color:#8A93A3; margin-top:2px;}

  .work{flex:1; min-width:0; display:flex; flex-direction:column; background:#fff;}
  /* Дії над позицією. Правити її склад тут нема потреби — це робить сам
     конструктор; лишається тільки те, чого він не вміє: порядок, копія,
     перенос у рекомендовані та видалення. */
  /* Дії живуть біля самої позиції, у списку, а не смугою над конструктором:
     смуга забирала висоту в того єдиного, заради чого сюди й заходять — у
     фото виробу. */
  .it-dots{flex:none; width:26px; height:26px; border-radius:7px; border:0; cursor:pointer;
    background:none; color:#9AA6B8; font-size:16px; line-height:1; opacity:0;}
  .it:hover .it-dots, .it.on .it-dots{opacity:1;}
  .it-dots:hover{background:#E7ECF4; color:#3D4C61;}
  .menu{position:fixed; z-index:60; min-width:196px; background:#fff; border:1px solid #E2E8F0;
    border-radius:12px; box-shadow:0 14px 40px rgba(15,32,52,.18); padding:6px;}
  .menu button{display:block; width:100%; text-align:left; font:inherit; font-size:13px;
    background:none; border:0; border-radius:8px; padding:9px 10px; cursor:pointer; color:#22314A;}
  .menu button:hover{background:#F1F5FA;}
  .menu button.is-del{color:#B3261E;}
  .menu button.is-del:hover{background:#FDECEA;}
  .why{margin:14px 0 4px; padding:10px 10px 11px; background:#FBFCFE;
    border:1px solid #E9EEF5; border-radius:10px;}
  /* Вибір товару. Каталог тут-таки, у вікні: перекидати менеджера на сайт
     заради вибору худі означало щоразу губити з очей пропозицію. */
  .pick{position:fixed; inset:0; z-index:200; background:rgba(15,32,52,.5);
    display:flex; align-items:center; justify-content:center; padding:18px;}
  .pick-c{width:100%; max-width:640px; max-height:84vh; background:#fff; border-radius:16px;
    display:flex; flex-direction:column; overflow:hidden;}
  .pick-h{flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 15px; border-bottom:1px solid #E9EEF5; font-size:14px;}
  .pick-b{flex:1; overflow:auto; padding:10px; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px;}
  .pick-i{display:flex; flex-direction:column; gap:6px; align-items:flex-start; text-align:left;
    font:inherit; background:#fff; border:1px solid #E2E8F0; border-radius:12px; padding:9px;
    cursor:pointer;}
  .pick-i:hover{border-color:#4F5FD4; box-shadow:0 4px 14px rgba(79,95,212,.13);}
  .pick-th{width:100%; aspect-ratio:1/1; border-radius:9px; background:#F1F4F8; overflow:hidden;
    display:flex; align-items:center; justify-content:center;}
  .pick-th img{width:100%; height:100%; object-fit:contain; display:block;}
  .pick-n{font-size:12.5px; font-weight:700; line-height:1.25;}
  .pick-p{font-size:11.5px; color:#7A879B;}
  .why-l{display:block; font-size:10.5px; font-weight:800; letter-spacing:.06em;
    text-transform:uppercase; color:#8A93A3; margin-bottom:6px;}
  .why-t{width:100%; font:inherit; font-size:13px; line-height:1.5; color:#22314A;
    border:1px solid #D9E1EC; border-radius:10px; padding:9px 11px; resize:vertical;}
  .why-t:focus{outline:none; border-color:#4F5FD4; box-shadow:0 0 0 3px rgba(79,95,212,.16);}
  .stage{flex:1; min-height:0; overflow:auto; position:relative;}
  .empty{padding:44px 20px; text-align:center; color:#8A93A3; font-size:13px; line-height:1.6;}
  .frame{width:100%; height:100%; border:0; display:block; background:#fff;}
  .hide{display:none !important;}

  /* Конструктор усередині робочого місця. Це та сама модалка, що на сайті,
     тільки вона більше не модалка: не висить поверх усього й не має власної
     шапки — вона і є вміст цієї сторінки. */
  .stage .contact-modal.lq-inline{position:static; inset:auto; width:auto; height:auto;
    max-height:none; opacity:1; transform:none; pointer-events:auto; overflow:visible;
    background:#fff; z-index:auto; display:block;}
  .stage .lq-inline .catalog-modal-topbar,
  .stage .lq-inline .contact-modal-back{display:none !important;}
  .stage .lq-inline .contact-modal-inner{padding:0; max-width:none;}
  .stage .lq-inline .pm-stage{width:100% !important; max-width:100% !important;
    height:min(64vh, 600px) !important; box-sizing:border-box;}
  .stage .lq-inline .pm-stage img{max-width:100%; max-height:100%; object-fit:contain;}
  .stage .lq-inline #pmGarmentWrap{max-width:100%; max-height:100%;}
  /* Вітрина для клієнта тут зайва: відгуки, опис, гарантії, підвал і
     рекомендації живуть на сайті, де вони й працюють. */
  .stage .lq-inline .pm-rows,
  .stage .lq-inline .pm-detail,
  .stage .lq-inline #pmModelSection,
  .stage .lq-inline .pm-twocol,
  .stage .lq-inline .pm-recommended,
  .stage .lq-inline .pm-footer,
  .stage .lq-inline .pm-footer-social,
  .stage .lq-inline .pm-legal-links{display:none !important;}
  #lqCtorHost > *{z-index:300;}
  @media (max-width:820px){
    .body{flex-direction:column;}
    .list{flex:0 0 auto; max-height:38vh; border-right:0; border-bottom:1px solid #E2E8F0;}
  }
</style>
</head>
<body>

<!-- Окремої смуги над робочим полем немає: вона забирала висоту в того
     єдиного, заради чого сюди й заходять, — у зображення виробу. Перемикач
     виглядів переїхав у ліву панель, а кнопка збереження й позначка стану —
     у шапку самого вікна пропозиції, рядком вище. -->
<div class="body">
  <aside class="list" id="paneList">
    <div class="tabs">
      <button class="tab on" data-view="build">Збирання</button>
      <button class="tab" data-view="client">Як бачить клієнт</button>
    </div>
    <span class="save" id="saveMark"></span>
    <div class="list-h">Склад пропозиції</div>
    <div class="list-b" id="listBody"></div>
    <!-- Сума — тільки основних позицій. Рекомендовані клієнт ще не обрав, і
         рахувати їх наперед означало б показувати менеджеру суму, якої
         немає. -->
    <div class="list-f">Разом<b id="listSum">—</b><span id="listMeta"></span></div>
  </aside>
  <main class="work" id="paneWork">
    <div class="stage" id="stage">
      <div class="empty">Оберіть позицію ліворуч або додайте товар.</div>
    </div>
  </main>
  <iframe class="frame hide" id="clientFrame" title="Як бачить клієнт"></iframe>
</div>

<script>
(function(){
  'use strict';
  /* ── Звʼязок з адмінкою ───────────────────────────────────────────────
     Пише в базу тільки адмінка: у неї доступ і права. Ця сторінка відкрита
     кадром і може бути з іншої адреси, тому все спілкування — виключно
     повідомленнями. Лізти у вікно адмінки напряму не можна: варто їй бути
     на іншому домені, і браузер це заблокує, а поламається все мовчки. */
  var OFFER = null;          // документ пропозиції від адмінки
  var CATALOG = [];          // товари для «додати»
  var CLIENT_URL = '';       // адреса клієнтської сторінки
  var cur = null;            // { kind, i } — позиція, яку зараз збираємо
  var dirty = false;         // у конструкторі є незбережені зміни
  var quiet = true;          // перші секунди після розгортання позиції правками не рахуємо
  var lastCount = -1;        // скільки позицій було, щоб побачити щойно додану
  var lastReco = -1;         // те саме окремо для рекомендованих
  var ctorReady = null;

  var CTOR_FP    = 'loomiq-fingerprint.js?v=85b09c3719';
  var CTOR_PRICE = 'loomiq-pricing.js?v=85b09c3719';
  var CTOR_JS   = 'loomiq-constructor.js?v=85b09c3719';
  var CTOR_CSS  = 'loomiq-constructor.css?v=85b09c3719';

  function send(msg){
    if(window.parent === window) return;
    try{ window.parent.postMessage(Object.assign({ lqEdit:true }, msg), '*'); }catch(e){}
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function money(n){ return Math.round(+n || 0).toLocaleString('uk-UA').replace(/ /g,' ') + ' грн'; }
  function mark(state, text){
    var el = document.getElementById('saveMark');
    el.className = 'save' + (state ? ' is-' + state : '');
    el.textContent = text || '';
  }

  /* ── Список позицій ─────────────────────────────────────────────────── */
  function itemsOf(kind){ return (kind === 'reco' ? (OFFER.reco || []) : (OFFER.items || [])); }
  /* Розклад ціни позиції — той самий, що в картці. Приходить готовим від
     адмінки разом із документом (OFFER.mgr) і в базу не потрапляє: це
     службові числа для менеджера, клієнт їх не бачить. */
  var openCalc = {};
  function calcRowsOf(kind, i){
    var m = OFFER && OFFER.mgr;
    var box = m && (kind === 'reco' ? m.reco : m.items);
    var one = box && box[i];
    return (one && Array.isArray(one.rows)) ? one.rows : null;
  }
  /* Чи платить хоч одна позиція окремий ескіз. Саме це й розводить ціни
     двох однакових на вигляд рядків, тож питати про це має сенс лише тоді,
     коли таке в складі справді є. */
  function hasExtraSketch(){
    var m = (OFFER && OFFER.mgr) || {}, found = false;
    ['items','reco'].forEach(function(k){
      var box = m[k] || {};
      Object.keys(box).forEach(function(j){
        ((box[j] || {}).rows || []).forEach(function(r){
          if(/^Додатковий ескіз/.test(String(r && r[0] || ''))) found = true;
        });
      });
    });
    return found;
  }
  function calcHtml(rows){
    return '<div class="it-calc">' + rows.map(function(r){
      var cls = r[2] ? ' class="is-' + r[2] + '"' : '';
      return '<div' + cls + '><span>' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>';
    }).join('') + '</div>';
  }
  function rowHtml(it, kind, i){
    var on = cur && cur.kind === kind && cur.i === i;
    var img = (it.mockups || []).filter(Boolean)[0] || '';
    var key = kind + ':' + i;
    var rows = calcRowsOf(kind, i);
    var open = !!(rows && openCalc[key]);
    return '<div class="it' + (on ? ' on' : '') + '" data-pick="' + kind + ':' + i + '">' +
      '<span class="it-th">' + (img ? '<img src="' + esc(img) + '" alt="">' : '') + '</span>' +
      '<span class="it-t">' +
        '<span class="it-n">' + esc(it.name || 'Позиція') +
          (it.optional ? '<b class="it-opt">вибір</b>' : '') + '</span>' +
        /* Слова «рекомендований» тут немає: над цими рядками стоїть заголовок
           «Рекомендовані», і повторювати його біля кожної назви — це шум.
           Замість нього — те саме, що в основних: тираж і ціна за штуку. */
        /* Видно й ціну за штуку, й суму: перше збігається з тим, що показує
           конструктор під виробом, друге — з тим, що піде в кошторис. */
        /* Щойно доданий основний товар кількості ще не має — її вказує
           менеджер у конструкторі. Показувати «0 × 400 грн = 0 грн» немає
           сенсу: це не ціна, це незаповнений рядок, і сказати про це прямо
           коротше, ніж змушувати здогадуватись за нулями. */
        '<span class="it-m">' + ((+it.qty || 0) > 0
          ? (+it.qty || 0) + ' × ' + money(it.unitPrice) +
            ' = ' + money((+it.sum || (+it.unitPrice || 0) * (+it.qty || 0))) +
            /* Позиція без розкладу не перераховується разом з рештою: її
               ціна лишається такою, якою її записали колись, і розходиться
               з тим, що показує картка. Кажемо це прямо. */
            (it.stale ? '<b class="it-todo"> · ціна застаріла, відкрийте й збережіть</b>' : '')
          : '<b class="it-todo">вкажіть розмір і кількість</b>') + '</span>' +
        (rows ? '<button class="it-why" data-why="' + key + '" ' +
                'title="З чого складається ця ціна">' +
                (open ? '▾ розклад' : '▸ розклад') + '</button>' : '') +
      '</span>' +
      '<button class="it-dots" data-dots="' + kind + ':' + i + '" title="Дії з позицією">⋯</button>' +
    '</div>' +
    (open ? calcHtml(rows) : '');
  }
  function renderList(){
    var box = document.getElementById('listBody');
    if(!OFFER){ box.innerHTML = ''; return; }
    var main = itemsOf('main'), reco = itemsOf('reco');

  // Firestore REST віддає значення в обгортках типів — розгортаємо в звичайний обʼєкт
  function unwrap(node){
    if(!node || typeof node !== 'object') return node;
    if(node.fields) return unwrap({ mapValue:{ fields: node.fields } });
    if(node.mapValue){
      var out = {}, f = node.mapValue.fields || {};
      Object.keys(f).forEach(function(k){ out[k] = unwrap(f[k]); });
      return out;
    }
    if(node.arrayValue) return (node.arrayValue.values || []).map(unwrap);
    if(node.stringValue !== undefined) return node.stringValue;
    if(node.integerValue !== undefined) return +node.integerValue;
    if(node.doubleValue !== undefined) return +node.doubleValue;
    if(node.booleanValue !== undefined) return !!node.booleanValue;
    if(node.nullValue !== undefined) return null;
    return node;
  }

      window.__pmEditIndex = 0;
      try{ if(window.__syncAddLabels) window.__syncAddLabels(); }catch(e){}
    } else {
      mountCtor();
    }
    /* Перші секунди після розгортання позиції конструктор ще довантажує фото
       й перемальовує ціну — це не правки менеджера, і вважати їх змінами не
       можна: інакше кожен перехід між позиціями заводив би зайвий запис. */
    quiet = true;
    dirty = false;
    mark('', '');
    setTimeout(function(){ quiet = false; }, 1800);
  }

  /* Щойно доданий РЕКОМЕНДОВАНИЙ товар доводимо до готового вигляду сам.
     У ньому не лишається жодного рішення за менеджером: тираж іде за
     найбільшою основною позицією, логотип замовлення конструктор ставить
     сам. А без збереження в пропозиції висить порожнє фото з каталогу — і
     клієнт бачить у «часто беруть разом» голу футболку замість своєї, з
     логотипом. Саме через це рекомендовані виглядали чужими.

     Базових товарів це не стосується: там кількість вносить менеджер, і
     зберігати за нього недороблену позицію не можна. */
  function readyReco(it, idx){
    if(!it || it.kind !== 'reco') return;
    if(it.config) return;                       // позицію вже збирали — не чіпаємо
    var q = Math.max(0, Math.round(+it.qty || 0));
    if(!q) return;
    if(typeof window.__lqSetQty === 'function') window.__lqSetQty({ 'Без розміру': q });
    // Чекаємо, поки ляже логотип: без нього збережеться той самий голий виріб
    var t0 = 0;
    var wait = function(){
      var has = 0;
      try{ has = window.__lqLayerCount ? window.__lqLayerCount() : 0; }catch(e){}
      if(has || t0 > 30){
        if(!has) return;                        // логотипа в замовленні немає — нема чого чекати
        saveCurrent().then(function(){ quiet = true; dirty = false;
          setTimeout(function(){ quiet = false; }, 1200); });
        return;
      }
      t0++; setTimeout(wait, 150);
    };
    setTimeout(wait, 300);
  }
  window.__lqDirty = function(){
    if(quiet || !cur) return;
    if(dirty) return;
    dirty = true;
    mark('', 'Є незбережені зміни');
  };
  function fail(e){
    console.warn('конструктор не відкрився', e);
    ctorReady = null;
    document.getElementById('stage').innerHTML =
      '<div class="empty">Конструктор не відкрився: ' + esc((e && e.message) || 'невідома причина') +
      '<br><button class="btn" id="retry" style="margin-top:12px;">Спробувати ще раз</button></div>';
    var r = document.getElementById('retry');
    if(r) r.addEventListener('click', function(){ if(cur) pickItem(cur.kind, cur.i, true); });
  }

  /* Перехід до позиції. Спершу зберігаємо ту, що збирали: менеджер міг
     півгодини накладати логотипи, і мовчки втратити це через один клік по
     сусідньому рядку — найдорожча помилка, яку тут можна зробити. */
  function pickItem(kind, i, force){
    if(!force && cur && cur.kind === kind && cur.i === i) return;
    var go = function(){
      cur = { kind: kind, i: i };
      renderList();
      parkCtor();
      document.getElementById('stage').innerHTML = '<div class="empty">Відкриваємо…</div>';
      send({ act:'editInline', kind: kind, i: i });
      loadCtor().catch(fail);
    };
    if(!dirty || force) return go();
    /* Не зберіглось — не йдемо мовчки. Найчастіша причина буденна: у нової
       позиції ще не вказано розмір і кількість, і конструктор замість запису
       показав підказку. Піти звідси означало б стерти півгодини роботи. */
    saveCurrent().then(function(ok){
      if(ok) return go();
      var m = 'Позицію не збережено — найімовірніше, не вказано розмір і кількість.\n\n' +
              'Перейти до іншої позиції й втратити ці зміни?';
      var leave = false;
      try{ leave = window.confirm(m); }catch(e){ leave = true; }
      if(leave) go();
    }, function(){ go(); });
  }
  /* Зберегти те, що зараз у конструкторі, і ДОЧЕКАТИСЬ кінця запису.
     Клік лише запускає роботу: спершу знімаються макети всіх ракурсів, потім
     летить запит до адмінки — на все це йдуть секунди. Доти ми вважали
     збереженим уже сам клік і бралися перемикати позицію: конструктор
     розбирали й засівали наново просто посеред збереження, і правки зникали.
     Тепер обіцянку запису віддає сам конструктор (__lqSavePromise), і
     перехід чекає саме на неї. */
  function saveCurrent(){
    if(!window.__lqSendToOrder || !window.cartItems || !window.cartItems.length)
      return Promise.resolve(false);
    var btn = document.getElementById('pmAddToCartBtn');
    if(!btn) return Promise.resolve(false);
    window.__lqSavePromise = null;
    mark('saving', 'Зберігаємо…');
    try{ btn.click(); }catch(e){ return Promise.resolve(false); }
    /* Конструктор міг і не почати запису — наприклад, не вибрано розмір і
       кількість, і замість збереження він показав підказку. Тоді обіцянки
       немає, і рахувати позицію збереженою не можна. */
    return waitSave(0);
  }
  function waitSave(tries){
    if(window.__lqSavePromise)
      return Promise.resolve(window.__lqSavePromise).then(function(ok){ return ok !== false; },
                                                          function(){ return false; });
    if(tries > 20){ mark('bad', 'Не збережено'); return Promise.resolve(false); }
    return new Promise(function(res){ setTimeout(res, 100); }).then(function(){ return waitSave(tries + 1); });
  }
  // Кнопка «Зберегти позицію» стоїть у шапці адмінки й просить нас звідти
  function onSaveRequest(){ saveCurrent(); }

  /* ── Вкладки ────────────────────────────────────────────────────────── */
  document.querySelectorAll('[data-view]').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('[data-view]').forEach(function(x){ x.classList.toggle('on', x === b); });
      var client = b.dataset.view === 'client';
      // Ховаємо тільки робоче поле: ліва панель зі складом і перемикачем
      // лишається на місці, інакше не буде чим перемкнутись назад
      document.getElementById('paneWork').classList.toggle('hide', client);
      var fr = document.getElementById('clientFrame');
      fr.classList.toggle('hide', !client);
      if(client){
        // Перед показом клієнтського вигляду віддаємо адмінці незбережене:
        // інакше менеджер звіряє пропозицію з тим, чого в ній ще немає
        var go = function(){
          if(!CLIENT_URL) return;
          fr.onload = function(){
            /* Даємо кадру ті самі дані, що маємо самі, — разом зі службовим
               прорахунком. Вигляд лишається клієнтським, редагування там не
               вмикається: у документі, який відкриє клієнт, цих цифр немає. */
            try{ fr.contentWindow.postMessage({ lqEditInit:true, preview:true, offer: OFFER }, '*'); }
            catch(e){}
          };
          fr.src = CLIENT_URL + '&t=' + Date.now();
        };
        if(dirty) saveCurrent().then(go, go); else go();
      }
    });
  });

  /* ── Повідомлення від адмінки ───────────────────────────────────────── */
  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || !d.lqEditInit || window.parent === window) return;
    if(d.doSave){ onSaveRequest(); return; }
    if(d.catalog) CATALOG = d.catalog;
    if(d.clientUrl) CLIENT_URL = d.clientUrl;
    if(d.seed !== undefined) window.__adminSeedItem = d.seed;
    if(d.cart !== undefined){
      window.__adminSeedCart = d.cart;
      /* Свіжий склад — і в кошик конструктора, але ЛИШЕ для сусідніх позицій.
         Активну не чіпаємо: людина зараз її і править, і підміна під руками
         скинула б незбережене. Без цього оновлення сусіди лишались зі
         старими тиражами: одна й та сама позиція рахувалась то за одну
         штуку, то за дві — залежно від того, коли ми востаннє бачили склад. */
      try{
        var keep = window.__lqEditOnly;
        if(Array.isArray(d.cart) && window.cartItems && keep != null){
          var fresh = JSON.parse(JSON.stringify(d.cart));
          if(fresh.length === window.cartItems.length){
            fresh.forEach(function(x, i){ if(i !== +keep) window.cartItems[i] = x; });
          }
        }
      }catch(e){ console.warn('склад не оновився', e); }
    }
    if(d.cartIndex !== undefined) window.__adminSeedIndex = d.cartIndex;
    if(d.target !== undefined) window.__adminOfferTarget = d.target;
    if(d.offer){
      OFFER = d.offer || {};
      OFFER.items = OFFER.items || [];
      OFFER.reco  = OFFER.reco  || [];
      renderList();
      var n = OFFER.items.length, nr = OFFER.reco.length;
      /* Щойно доданий товар одразу стає активним: менеджер натиснув «додати»
         саме щоб його налаштувати, а не щоб потім шукати в списку.
         Рекомендовані рахуємо окремо: вони лежать своїм списком, і доти
         додавання рекомендації нічого не відкривало — вона тихо падала в
         кінець панелі голою, без тиражу й без логотипа. */
      if(lastCount >= 0 && n > lastCount) pickItem('main', n - 1);
      else if(lastReco >= 0 && nr > lastReco) pickItem('reco', nr - 1);
      // Перша позиція відкривається сама: порожнє робоче місце змушує
      // здогадуватись, що робити далі
      else if(!cur && n) pickItem('main', 0);
      lastCount = n; lastReco = nr;
      return;
    }
    if(d.editReady != null){
      if(!d.editReady){ document.getElementById('stage').innerHTML =
        '<div class="empty">Позицію не знайдено.</div>'; return; }
      loadCtor().then(seedCtor).catch(fail);
      return;
    }
  });

  /* Сигналу «я готовий» звідси немає навмисно: адмінка віддає дані сама,
     коли кадр завантажився, а слово «ready» в її мові вже зайняте — воно
     означає дату готовності замовлення. Один такий сигнал стер би її. */
})();
</script>
</body>
</html>
