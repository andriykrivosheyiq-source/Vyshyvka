# Loomiq — грошовий воркер: Монобанк, Приват, накладений платіж Нової пошти.
#
# Запуск:  npx wrangler deploy -c wrangler.money.toml
#
# ⚠️ У ЦЬОМУ ФАЙЛІ НЕМАЄ Й НЕ БУДЕ ЖОДНОГО КЛЮЧА. Він лежить у репозиторії,
#    а репозиторій читають. Усі доступи кладуться окремо, командою
#    `wrangler secret put` — вони зберігаються в Cloudflare і назовні не
#    виходять навіть для того, хто їх поклав.

name = "loomiq-money"
main = "money.js"
compatibility_date = "2024-11-01"

[vars]
# Проєкт Firebase — той самий, що в адмінці. Це не таємниця: його видно в
# коді сторінки, і сам по собі він нічого не відкриває.
FIREBASE_PROJECT = "loomiq-admin"

# Куди класти накладений платіж Нової пошти, якщо в Фінансах немає рахунку з
# банком «Нова пошта». Порожнє значення означає «рахунок не вказано» — так
# чесніше, ніж покласти гроші в чужий підсумок.
NP_ACCOUNT = ""

# Розклад опитування. Приват і Нова пошта самі нічого не шлють.
#
# Кожні пʼять хвилин: Приват дописує виписку протягом дня, і чекати годину
# означає відповідати клієнту «ще не бачу оплати», коли вона вже є.
# Накладений платіж їде тижнями, тож частіше йому й не треба — але окремий
# розклад на нього був би другим місцем, де щось може зламатись.
[triggers]
crons = ["*/5 * * * *"]

# ── Секрети (кладуться командами, не сюди) ───────────────────────────────
#
#   npx wrangler secret put FIREBASE_SA -c wrangler.money.toml
#       JSON службового акаунта Firebase цілком, одним рядком.
#       Firebase → Налаштування проєкту → Службові акаунти → Створити ключ.
#
#   npx wrangler secret put HOOK_SECRET -c wrangler.money.toml
#       Довгий випадковий рядок. Стоїть у адресі вебхука, щоб дописувати нам
#       рухи не міг кожен, хто цю адресу вгадає.
#
#   npx wrangler secret put MONO_TOKEN_mono1 -c wrangler.money.toml
#       Токен ФОПа з api.monobank.ua — свій на кожен рахунок. Назва секрета
#       мусить збігатись із кодом рахунку в Фінансах: mono1, mono2, …
#
#   npx wrangler secret put PRIVAT_ID_privat1 -c wrangler.money.toml
#   npx wrangler secret put PRIVAT_TOKEN_privat1 -c wrangler.money.toml
#       Приват24 для бізнесу → Автоклієнт → створити токен.
#       У самому рахунку (Фінанси → Рахунки) має бути заповнений IBAN:
#       Автоклієнт віддає рухи по конкретному рахунку.
#
#   npx wrangler secret put NP_API_KEY -c wrangler.money.toml
#       Той самий ключ Нової пошти, що й для накладних.
